<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sonora</title>
<style>
  :root {
    --bg: #F6F7FA;
    --card: #FFFFFF;
    --ink: #14181F;
    --slate: #5B667A;
    --muted: #8E99AB;
    --line: #E6E9F0;
    --soft: #F0F3F8;
    --vitality: #DDF247;

    /* Pastel Clinical Bento Tokens (Ref 1, 2, 3) */
    --sky-card: #DCEFF9;
    --sky-mid: #BAE0F5;
    --sky-deep: #0F4C75;
    --mint-card: #E2F6DF;
    --mint-mid: #C5ECC0;
    --mint-deep: #0A5C36;
    --lav-card: #EFE7FD;
    --lav-mid: #DECSTL;
    --lav-deep: #4A1D96;
    --butter: #FBF09C;
    --butter-deep: #78350F;
    --coral-card: #FDECEF;
    --coral-deep: #9F1239;

    --emerald: #10B981;
    --emerald-ink: #065F46;
    --amber: #F59E0B;
    --rose: #E11D48;

    --serif: Georgia, "Times New Roman", serif;
    --sans: Roboto, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans);
    overflow: hidden; -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  input, textarea, select { user-select: text; -webkit-user-select: text; font-family: inherit; }
  button { font-family: inherit; }
  #app { width: 100%; height: 100%; position: relative; }

  .screen-scroll {
    height: 100%; overflow-y: auto; overflow-x: hidden;
    padding: 14px 16px 108px 16px;
  }
  .screen-scroll::-webkit-scrollbar { display: none; }

  svg.icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; flex-shrink: 0; }
  svg.xs { width: 14px; height: 14px; }
  svg.sm { width: 16px; height: 16px; }
  svg.lg { width: 24px; height: 24px; }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Editorial & Display Typography */
  .editorial-title {
    font-family: var(--serif);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--ink);
  }
  .tabular { font-variant-numeric: tabular-nums; }

  /* Top Bar */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 16px; min-height: 44px;
  }
  .top-left { display: flex; align-items: center; gap: 11px; min-width: 0; cursor: pointer; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--ink); color: var(--vitality);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(20,24,31,0.10);
    border: 2px solid #FFFFFF;
  }
  .greeting-sub { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--slate); }
  .page-title { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px; background: #FFFFFF;
    border: 1px solid var(--line); font-size: 11px; font-weight: 700; color: var(--slate);
    flex-shrink: 0; box-shadow: 0 1px 3px rgba(15,23,42,0.03);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }

  /* Bento Cards */
  .card {
    background: var(--card); border-radius: 26px; padding: 18px;
    border: 1px solid var(--line); margin-bottom: 12px;
    box-shadow: 0 4px 18px rgba(20, 24, 31, 0.035);
  }
  .bento-sky { background: var(--sky-card); border-color: rgba(15,76,117,0.08); }
  .bento-mint { background: var(--mint-card); border-color: rgba(10,92,54,0.08); }
  .bento-lav { background: var(--lav-card); border-color: rgba(74,29,150,0.08); }
  .bento-butter { background: var(--butter); border-color: rgba(120,53,15,0.10); }
  .bento-coral { background: var(--coral-card); border-color: rgba(159,18,57,0.10); }

  .hero {
    border-radius: 28px; padding: 20px; margin-bottom: 12px;
    position: relative; overflow: hidden;
    box-shadow: 0 6px 22px rgba(15, 76, 117, 0.07);
  }
  .eyebrow {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--sky-deep); display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }
  .hero-grid {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .hero-title {
    font-family: var(--serif); font-size: 24px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.15; color: var(--ink);
  }
  .hero-sub { font-size: 13px; color: #334155; margin-top: 6px; font-weight: 600; line-height: 1.4; }
  .pill-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.75); color: var(--ink);
    font-size: 11px; font-weight: 800; margin-top: 8px;
  }

  /* Butter CTA Button with circular white arrow (Ref 1) */
  .cta {
    margin-top: 16px; width: 100%; background: var(--butter); border: 1px solid rgba(120,53,15,0.12);
    border-radius: 999px; padding: 8px 8px 8px 18px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 800; color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 12px rgba(120,53,15,0.08);
  }
  .cta:active { transform: scale(0.99); }
  .cta-circle {
    width: 36px; height: 36px; border-radius: 50%; background: #FFFFFF;
    display: flex; align-items: center; justify-content: center; color: var(--ink);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .sec-row { display: flex; align-items: center; justify-content: space-between; margin: 16px 4px 10px 4px; }
  .sec-title { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  .muted { font-size: 12px; color: var(--slate); line-height: 1.45; }

  /* Ref 1 Vertical Pill-Capsule Week Strip */
  .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .w-pill {
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 10px 0 9px 0; border-radius: 999px; background: var(--soft);
    min-height: 68px; border: 1px solid transparent; transition: all 0.15s;
  }
  .w-pill.has-sess { background: #EBF8F2; border-color: rgba(16,185,129,0.25); }
  .w-pill.today { background: var(--ink); color: #FFFFFF; box-shadow: 0 4px 12px rgba(20,24,31,0.18); }
  .w-pill .wl { font-size: 10px; font-weight: 800; color: var(--slate); text-transform: uppercase; }
  .w-pill.today .wl { color: rgba(255,255,255,0.7); }
  .w-pill .wn { font-size: 14px; font-weight: 800; }
  .w-pill .wd { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
  .w-pill .wd.on { background: var(--emerald); }
  .w-pill.today .wd.on { background: var(--vitality); }

  /* 2-Column Bento Split (Ref 1) */
  .bento-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .bento-2col .card { margin-bottom: 0; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
  .kpi-num { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .delta-pill {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 800;
  }
  .delta-good { background: #D1FAE5; color: #065F46; }
  .delta-warn { background: #FFE4E6; color: #9F1239; }

  /* Ref 1 Horizontal 3-Subsystem Mint Card with Vertical Capsule Bars */
  .subsys-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .subsys-item {
    background: rgba(255,255,255,0.72); border-radius: 18px; padding: 11px 10px;
    display: flex; align-items: center; gap: 9px;
  }
  .v-cap-track {
    width: 10px; height: 42px; border-radius: 999px; background: rgba(10,92,54,0.12);
    display: flex; align-items: flex-end; overflow: hidden; flex-shrink: 0;
  }
  .v-cap-fill { width: 100%; border-radius: 999px; transition: height 0.25s; }

  /* Ref 3 Practice Bento Tiles */
  .tiles-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 12px; }
  .p-tile {
    border: 1px solid rgba(20,24,31,0.06); border-radius: 22px; padding: 14px 11px;
    cursor: pointer; color: var(--ink); text-align: left;
    display: flex; flex-direction: column; justify-content: space-between; min-height: 122px;
    position: relative; box-shadow: 0 3px 10px rgba(20,24,31,0.03);
  }
  .p-tile:active { transform: scale(0.98); }
  .p-tile-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .p-tile-icon {
    width: 34px; height: 34px; border-radius: 12px; background: rgba(255,255,255,0.88);
    display: flex; align-items: center; justify-content: center;
  }
  .p-tile-arrow {
    width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.75);
    display: flex; align-items: center; justify-content: center;
  }
  .p-tile-title { font-size: 13px; font-weight: 800; line-height: 1.2; margin-top: 10px; }
  .p-tile-tag { font-size: 10px; font-weight: 700; color: #334155; margin-top: 3px; opacity: 0.85; }

  /* Segmented Control & Horizontal Scroll Chips */
  .seg {
    display: flex; background: #E6EAF2; padding: 4px; border-radius: 16px;
    margin-bottom: 12px; gap: 4px;
  }
  .seg button {
    flex: 1; border: none; background: transparent; padding: 9px 6px; border-radius: 12px;
    font-size: 12px; font-weight: 800; color: var(--slate); cursor: pointer; transition: all 0.12s;
  }
  .seg button.on { background: #FFFFFF; color: var(--ink); box-shadow: 0 2px 6px rgba(15,23,42,0.08); }

  .chip-scroll {
    display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px;
  }
  .chip-scroll::-webkit-scrollbar { display: none; }
  .chip {
    padding: 8px 13px; border-radius: 999px; font-size: 12px; font-weight: 800;
    border: 1px solid var(--line); background: #FFFFFF; color: var(--slate);
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .chip.on { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }

  /* Step Pills & Studio */
  .step-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .step-tab {
    border: 1px solid var(--line); background: var(--soft); border-radius: 14px;
    padding: 9px 6px; font-size: 11px; font-weight: 800; color: var(--slate);
    display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer;
  }
  .step-tab.cur { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
  .step-tab.done { background: #E6F9F0; color: var(--emerald-ink); border-color: #A7F3D0; }

  .passage-box {
    background: var(--soft); border: 1px solid var(--line); border-radius: 20px;
    padding: 18px 16px; font-family: var(--serif); font-size: 19px; font-weight: 700;
    line-height: 1.5; margin: 12px 0 14px 0; color: var(--ink); position: relative;
  }

  /* Live Waveform Bars */
  .wave-bars {
    display: flex; align-items: center; justify-content: space-between;
    height: 44px; gap: 4px; padding: 0 6px; margin: 10px 0 12px 0;
  }
  .wave-bar {
    flex: 1; background: var(--rose); border-radius: 999px; height: 18%;
    transition: height 0.08s ease;
  }

  /* Buttons */
  .btn {
    width: 100%; background: var(--ink); color: #FFFFFF; border: none; border-radius: 18px;
    padding: 14px 18px; font-size: 14px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; text-decoration: none;
  }
  .btn:disabled { opacity: 0.5; }
  .btn.red { background: var(--rose); }
  .btn.sky { background: var(--sky-deep); }
  .btn.emerald { background: var(--emerald-ink); }
  .btn.ghost { background: #FFFFFF; color: var(--ink); border: 1px solid var(--line); }
  .btn.soft { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }

  .icon-btn {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 16px; border: 1px solid var(--line);
    background: #FFFFFF; color: var(--ink); display: flex; align-items: center; justify-content: center;
    cursor: pointer; text-decoration: none;
  }
  .icon-btn.sm { width: 38px; height: 38px; border-radius: 12px; }
  .icon-btn.round { border-radius: 50%; }
  .link-btn {
    background: none; border: none; padding: 0; font-size: 12px; font-weight: 800;
    color: var(--sky-deep); display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row-between { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

  .input, .select {
    width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: #F8FAFC; font-size: 14px; font-weight: 600; color: var(--ink);
    outline: none; margin-bottom: 10px;
  }
  .input:focus, .select:focus { border-color: var(--sky-deep); background: #FFFFFF; }
  .field-label { font-size: 11px; font-weight: 800; color: var(--slate); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; display: block; }

  /* Lists */
  .list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .list-row:first-child { border-top: none; padding-top: 0; }
  .list-row:last-child { padding-bottom: 0; }
  .lr-title { font-size: 14px; font-weight: 800; color: var(--ink); }
  .lr-sub { font-size: 12px; color: var(--slate); margin-top: 2px; line-height: 1.4; }
  .menu-row {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: none; border: none; padding: 13px 0; border-top: 1px solid var(--line);
    font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer; text-align: left;
  }
  .menu-row:first-child { border-top: none; padding-top: 2px; }
  .menu-row:last-child { padding-bottom: 2px; }
  .menu-row .lhs { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .menu-row .chev { color: var(--muted); flex-shrink: 0; }

  /* Loudness Meter & Rolling Graph */
  .meter-num { font-size: 56px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .meter-unit { font-size: 16px; font-weight: 800; color: var(--slate); margin-left: 4px; }
  .meter-track { position: relative; height: 12px; background: var(--soft); border-radius: 999px; overflow: hidden; margin: 12px 0; }
  .meter-fill { height: 100%; width: 0%; background: var(--sky-deep); transition: width 0.08s linear; border-radius: 999px; }

  /* Pacing Words */
  .words { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0 16px 0; }
  .word {
    padding: 12px 15px; border-radius: 16px; background: var(--soft);
    font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--slate);
    transition: all 0.12s; border: 1px solid transparent;
  }
  .word.on {
    background: var(--sky-deep); color: #FFFFFF; transform: scale(1.06);
    box-shadow: 0 4px 12px rgba(15,76,117,0.22);
  }

  /* Ref 2 Tactile Contrast Word Cards */
  .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .pair-card {
    border-radius: 22px; padding: 20px 12px 14px 12px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    min-height: 146px; border: 1px solid rgba(20,24,31,0.06);
  }
  .pair-word { font-family: var(--serif); font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .pair-ipa { font-size: 12px; font-weight: 700; color: var(--slate); margin-top: 2px; }
  .tts-pill {
    margin-top: 12px; border: none; border-radius: 999px; padding: 7px 13px;
    background: rgba(255,255,255,0.9); color: var(--ink); font-size: 11px; font-weight: 800;
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  /* Map */
  .map-wrap {
    position: relative; border-radius: 24px; overflow: hidden;
    background: #E5E9EF; height: 220px; margin-bottom: 10px; border: 1px solid var(--line);
  }
  .map-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  .map-toggle {
    position: absolute; top: 10px; right: 10px; border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 12px; background: rgba(255,255,255,0.94); color: var(--ink);
    font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 5px;
    box-shadow: 0 2px 8px rgba(15,23,42,0.14); cursor: pointer;
  }

  /* Ref 3 Longitudinal Trajectory Bar Chart */
  .chart-wrap {
    position: relative; height: 148px; padding: 18px 4px 24px 4px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;
    border-bottom: 1px solid var(--line); margin-bottom: 10px;
  }
  .chart-avg-line {
    position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--sky-deep);
    pointer-events: none; z-index: 2;
  }
  .chart-avg-tag {
    position: absolute; right: 0; top: -18px; background: var(--sky-deep); color: #FFFFFF;
    font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 6px;
  }
  .chart-col {
    flex: 1; height: 100%; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; cursor: pointer; position: relative;
  }
  .chart-bar {
    width: 100%; max-width: 26px; border-radius: 8px 8px 4px 4px;
    transition: height 0.25s; min-height: 6px;
  }
  .chart-lbl {
    position: absolute; bottom: -20px; font-size: 9px; font-weight: 700;
    color: var(--slate); white-space: nowrap;
  }

  /* Bottom Floating Pill Navigation */
  .nav-wrap { position: absolute; left: 14px; right: 14px; bottom: 10px; z-index: 50; }
  .nav {
    background: var(--ink); border-radius: 999px; padding: 6px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 10px 28px rgba(20,24,31,0.22);
  }
  .nav-item {
    border: none; background: transparent; color: #94A3B8; height: 44px; min-width: 44px;
    padding: 0 12px; border-radius: 999px; display: flex; align-items: center;
    justify-content: center; gap: 6px; font-size: 12px; font-weight: 800; cursor: pointer;
    transition: all 0.15s;
  }
  .nav-item span { display: none; }
  .nav-item.on { background: var(--vitality); color: var(--ink); padding: 0 15px; }
  .nav-item.on span { display: inline; }

  /* Bottom Sheet */
  .backdrop {
    position: absolute; inset: 0; background: rgba(15,23,42,0.48); z-index: 100;
    display: flex; align-items: flex-end;
  }
  .sheet {
    width: 100%; max-height: 84%; overflow-y: auto; background: #FFFFFF;
    border-radius: 28px 28px 0 0; padding: 20px 20px 26px 20px;
  }
  .sheet-handle { width: 40px; height: 4px; background: var(--line); border-radius: 999px; margin: 0 auto 14px auto; }
  .sheet h3 { font-family: var(--serif); font-size: 20px; font-weight: 700; margin: 0 0 8px 0; }
  .sheet p { font-size: 13px; color: #475569; line-height: 1.55; margin: 0 0 14px 0; }

  .alert {
    display: flex; gap: 10px; align-items: flex-start; padding: 13px 14px;
    border-radius: 18px; background: var(--coral-card); color: var(--coral-deep);
    font-size: 12px; font-weight: 700; line-height: 1.45; margin-bottom: 12px;
  }

  #print-report { display: none; }
  @media print {
    #app { display: none !important; }
    html, body { overflow: visible; height: auto; background: #FFFFFF; }
    #print-report { display: block; padding: 24px; font-size: 13px; color: #000; }
    #print-report table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    #print-report th, #print-report td { text-align: left; border-bottom: 1px solid #ccc; padding: 6px 4px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print-report"></div>

<script>
// ============================================================================
// Lucide SVG Icons Only — Zero Emojis Anywhere
// ============================================================================
const LUCIDE = {

function parseIsoMs(iso) {
  if (!iso) return 0;
  const t = new Date(String(iso).replace(" ", "T")).getTime();
  return isNaN(t) ? 0 : t;
}

function normalizeServerSession(s) {
  if (!s) return null;
  if (s.dateIso && typeof s.probability === "number") return s;
  const ts = String(s.timestamp || "").replace(" ", "T");
  const fallbackMs = s.createdAt && s.createdAt.seconds ? s.createdAt.seconds * 1000 : Date.now();
  const ms = parseIsoMs(ts) || fallbackMs;
  return {
    id: s.session_id || s.id || ("s" + ms),
    dateIso: new Date(ms).toISOString(),
    diagnosis: s.consensus_diagnosis || (s.is_dysarthric ? "Dysarthria Detected" : "Speech Within Normal Limits"),
    isDysarthric: !!s.is_dysarthric,
    severity: s.consensus_severity || "normal",
    probability: typeof s.consensus_probability === "number" ? s.consensus_probability : 0,
    confidence: s.confidence_rating || "Moderate",
    votes: s.dysarthria_vote_ratio || "0/3",
    recommendation: s.clinical_recommendation || "",
    tasks: (s.utterances || []).map(u => ({
      task: u.task_name,
      p: u.dysarthria_probability,
      severity: u.predicted_severity
    }))
  };
}

function userStorageKey(u) {
  if (!u || u.provider === "guest" || u.uid === "guest") return null;
  return "sonora_sessions_user_" + (u.uid || (u.email || "").toLowerCase());
}

function mergeSessionsList(lists) {
  const map = new Map();
  for (const list of lists) {
    if (!Array.isArray(list)) continue;
    for (const raw of list) {
      const item = normalizeServerSession(raw);
      if (item && item.id && !map.has(item.id)) map.set(item.id, item);
    }
  }
  const merged = Array.from(map.values());
  merged.sort((a, b) => parseIsoMs(b.dateIso) - parseIsoMs(a.dateIso));
  return merged;
}

function loadUserSessionsHydrated(u) {
  if (!u || u.provider === "guest" || u.uid === "guest") return [];
  const uKey = userStorageKey(u);
  let cached = [];
  try {
    const raw = uKey ? localStorage.getItem(uKey) : null;
    if (raw) cached = JSON.parse(raw) || [];
  } catch (e) {}
  const emailLower = (u.email || "").trim().toLowerCase();
  const cleared = uKey && localStorage.getItem(uKey + "_cleared") === "1";
  const seeded = cleared ? [] : ACCOUNT_SEED_SCREENINGS.filter(s =>
    (u.uid && s.userId === u.uid) || (emailLower && (s.userEmail || "").trim().toLowerCase() === emailLower)
  );
  return mergeSessionsList([cached, seeded]);
}

function hydrateSeedProfile(u) {
  if (!u) return;
  const emailLower = (u.email || "").trim().toLowerCase();
  const seed = ACCOUNT_SEED_PROFILES[emailLower];
  if (seed) {
    if (!state.profile.fullName) state.profile.fullName = seed.fullName;
    if (!state.profile.age) state.profile.age = seed.age;
    if (!state.profile.sex) state.profile.sex = seed.sex;
    if (!state.profile.condition) state.profile.condition = seed.condition;
    if (!u.photo && seed.photoURL) u.photo = seed.photoURL;
    if ((!u.name || u.name === emailLower.split("@")[0]) && seed.fullName) u.name = seed.fullName;
  } else if (!state.profile.fullName && u.name) {
    state.profile.fullName = u.name;
  }
}

try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    const p = JSON.parse(raw);
    if (p.user) state.user = p.user;
    if (p.profile) state.profile = { ...state.profile, ...p.profile };
    if (Array.isArray(p.sessions)) state.sessions = p.sessions;
    if (Array.isArray(p.customPhrases)) state.customPhrases = p.customPhrases;
    if (p.coords && typeof p.coords.lat === "number" && typeof p.coords.lon === "number") {
      state.coords = p.coords;
      state.cityFilter = "Near Me";
    }
  } else {
    const old = localStorage.getItem(LEGACY_KEY);
    if (old) {
      const p = JSON.parse(old);
      if (p.user && p.user.provider !== "guest") state.user = p.user;
    }
  }
  if (state.user && state.user.provider !== "guest") {
    hydrateSeedProfile(state.user);
    state.sessions = mergeSessionsList([state.sessions, loadUserSessionsHydrated(state.user)]);
  }
} catch (e) {}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      user: state.user,
      profile: state.profile,
      sessions: state.sessions,
      customPhrases: state.customPhrases,
      coords: state.coords
    }));
    const uKey = userStorageKey(state.user);
    if (uKey) localStorage.setItem(uKey, JSON.stringify(state.sessions));
  } catch (e) {}
}

async function syncUserSessions() {
  const u = state.user;
  if (!u || u.provider === "guest" || u.uid === "guest") return;
  hydrateSeedProfile(u);
  const hydrated = mergeSessionsList([state.sessions, loadUserSessionsHydrated(u)]);
  if (hydrated.length !== state.sessions.length) {
    state.sessions = hydrated;
    saveState();
    render();
  }
  const qs = "userId=" + encodeURIComponent(u.uid || "") + "&email=" + encodeURIComponent(u.email || "");
  for (const origin of WEB_SYNC_ORIGINS) {
    try {
      const r = await fetchJson(origin + "/api/screenings?" + qs, null, 3500);
      if (r.ok && r.json && Array.isArray(r.json.screenings)) {
        const uKey = userStorageKey(u);
        if (uKey && r.json.screenings.length) localStorage.removeItem(uKey + "_cleared");
        const next = mergeSessionsList([r.json.screenings, state.sessions]);
        if (next.length !== state.sessions.length || JSON.stringify(next.map(x => x.id)) !== JSON.stringify(state.sessions.map(x => x.id))) {
          state.sessions = next;
          saveState();
          render();
        }
        // Also sync profile from the same origin
        try {
          const pr = await fetchJson(origin + "/api/profile?" + qs, null, 3000);
          if (pr.ok && pr.json && pr.json.profile) {
            const prof = pr.json.profile;
            state.profile = {
              fullName: prof.fullName || state.profile.fullName || u.name || "",
              age: prof.age || state.profile.age || "",
              sex: prof.sex || state.profile.sex || "Male",
              condition: prof.condition || state.profile.condition || "Undiagnosed / General Motor Speech Screening"
            };
            if (prof.photoURL && !u.photo) u.photo = prof.photoURL;
            if (prof.fullName) u.name = prof.fullName;
            saveState();
          }
        } catch (e2) {}
        break;
      }
    } catch (e) {}
  }
}

function native() { return window.SonoraNative || null; }
function haptic(ms) { const n = native(); if (n && n.hapticTick) n.hapticTick(ms || 20); }
function toast(msg) { const n = native(); if (n && n.showToast) n.showToast(msg); }

function speakWord(text, rate) {
  haptic(12);
  const n = native();
  if (n && n.speakText) {
    n.speakText(String(text || ""), rate || 0.85);
    return;
  }
  try {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text || ""));
      u.lang = "en-US";
      u.rate = rate || 0.85;
      window.speechSynthesis.speak(u);
    }
  } catch (e) {}
}

async function firebaseEmailAuth(email, password, isSignUp) {
  state.authBusy = true; state.authError = ""; render();
  const endpoint = isSignUp ? "accounts:signUp" : "accounts:signInWithPassword";
  try {
    const res = await fetch("https://identitytoolkit.googleapis.com/v1/" + endpoint + "?key=" + FIREBASE_API_KEY, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email.trim(), password, returnSecureToken: true })
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && data.error.message) || "Sign-in failed";
      const friendly = {
        EMAIL_EXISTS: "An account with this email already exists. Sign in instead.",
        INVALID_LOGIN_CREDENTIALS: "Wrong email or password.",
        EMAIL_NOT_FOUND: "No account with this email.",
        INVALID_PASSWORD: "Wrong email or password.",
        TOO_MANY_ATTEMPTS_TRY_LATER: "Too many attempts. Try again later."
      };
      state.authError = friendly[msg.split(" ")[0]] || msg.replace(/_/g, " ").toLowerCase();
      state.authBusy = false; render(); return;
    }
    const base = email.split("@")[0].replace(/[._0-9]+/g, " ").trim() || "there";
    state.user = { uid: data.localId, email: data.email, name: data.displayName || (base.charAt(0).toUpperCase() + base.slice(1)), provider: "password" };
    hydrateSeedProfile(state.user);
    state.sessions = loadUserSessionsHydrated(state.user);
    state.authBusy = false; saveState(); haptic(30); render();
    syncUserSessions();
  } catch (err) {
    state.authError = "No internet connection.";
    state.authBusy = false; render();
  }
}

function triggerGoogleSignIn() {
  state.authError = "";
  const n = native();
  if (n && n.signInWithGoogle) { state.authBusy = true; render(); n.signInWithGoogle(); }
  else { state.authError = "Google sign-in is only available in the Android app."; render(); }
}

window.onNativeGoogleSignIn = async function(idToken, email, name, photo) {
  try {
    const res = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithIdp?key=" + FIREBASE_API_KEY, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        postBody: "id_token=" + encodeURIComponent(idToken) + "&providerId=google.com",
        requestUri: "http://localhost", returnSecureToken: true, returnIdpCredential: true
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data && data.error && data.error.message) || "Firebase sign-in failed");
    state.user = {
      uid: data.localId,
      email: data.email || email,
      name: data.displayName || name || (email || "").split("@")[0],
      photo: data.photoUrl || photo || "",
      provider: "google"
    };
    hydrateSeedProfile(state.user);
    state.sessions = loadUserSessionsHydrated(state.user);
    saveState(); haptic(30);
    syncUserSessions();
  } catch (e) {
    state.authError = /Failed to fetch|NetworkError/i.test(e.message) ? "No internet connection." : e.message.replace(/_/g, " ").toLowerCase();
  }
  state.authBusy = false; render();
};

function cleanMobile(raw) {
  let d = String(raw || "").replace(/\D/g, "");
  if (d.length === 12 && d.startsWith("91")) d = d.slice(2);
  if (d.length === 11 && d.startsWith("0")) d = d.slice(1);
  return d;
}

async function otpApi(payload) {
  const r = await fetchJson(SITE_BASE + "/api/auth/otp", { method: "POST", json: Object.assign({ channel: "android", countryCode: "91" }, payload) }, 30000);
  const data = r.json || {};
  if (!r.ok || data.success === false) {
    throw new Error(data.error || (r.status === 404 ? "Phone sign-in is not available right now." : "Something went wrong. Please try again."));
  }
  return data;
}

window.openPhoneLogin = function() { state.authView = "phone"; state.authError = ""; render(); setTimeout(() => { const el = document.getElementById("auth-phone"); if (el) el.focus(); }, 50); };
window.backToAuthMain = function() { state.authView = "main"; state.authError = ""; state.authBusy = false; render(); };

window.sendPhoneOtp = async function(e) {
  if (e) e.preventDefault();
  const el = document.getElementById("auth-phone");
  const mobile = cleanMobile(el ? el.value : state.phoneNumber);
  state.phoneNumber = mobile;
  if (mobile.length !== 10) { state.authError = "Enter a valid 10-digit mobile number."; render(); return; }
  if (Date.now() < state.otpResendAt) { state.authError = "Please wait before requesting another code."; render(); return; }
  state.authBusy = true; state.authError = ""; render();
  try {
    const data = await otpApi({ action: "send", mobileNumber: mobile });
    state.otpResendAt = Date.now() + (data.cooldownSec || 30) * 1000;
    state.authView = "otp";
    haptic(20);
  } catch (err) {
    state.authError = /Failed to fetch|timeout/i.test(err.message) ? "No internet connection." : err.message;
  }
  state.authBusy = false; render();
  setTimeout(() => { const c = document.getElementById("auth-otp"); if (c) c.focus(); }, 50);
};

async function firebasePasswordCall(endpoint, email, password) {
  const res = await fetch("https://identitytoolkit.googleapis.com/v1/" + endpoint + "?key=" + FIREBASE_API_KEY, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, returnSecureToken: true })
  });
  const data = await res.json();
  return { ok: res.ok, data };
}

window.verifyPhoneOtp = async function(e) {
  if (e) e.preventDefault();
  const el = document.getElementById("auth-otp");
  const code = String(el ? el.value : "").replace(/\D/g, "");
  if (code.length !== 6) { state.authError = "Enter the 6-digit code."; render(); return; }
  state.authBusy = true; state.authError = ""; render();
  try {
    const v = await otpApi({ action: "verify", mobileNumber: state.phoneNumber, code });
    // Sign in to the Firebase account bound to this phone number (create it on first use).
    let r = await firebasePasswordCall("accounts:signInWithPassword", v.firebaseEmail, v.firebasePassword);
    if (!r.ok) {
      const msg = (r.data && r.data.error && r.data.error.message) || "";
      if (/EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD/.test(msg)) {
        r = await firebasePasswordCall("accounts:signUp", v.firebaseEmail, v.firebasePassword);
      }
    }

// ============================================================================
// Native HTTP Bridge & Model Server Detection
// ============================================================================
let apiMode = null;
let httpSeq = 0;
const httpPending = {};
window.onNativeHttp = function(id, status, text) {
  const cb = httpPending[id]; if (!cb) return;
  delete httpPending[id]; cb(status, text);
};

function toBase64(bytes) {
  let bin = ""; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}

async function buildMultipart(parts) {
  const boundary = "----sonora" + Date.now().toString(16) + Math.random().toString(16).slice(2);
  const enc = new TextEncoder(), chunks = [];
  for (const p of parts) {
    if (p.blob) {
      chunks.push(enc.encode("--" + boundary + "\r\nContent-Disposition: form-data; name=\"" + p.name + "\"; filename=\"" + p.filename + "\"\r\nContent-Type: " + (p.blob.type || "application/octet-stream") + "\r\n\r\n"));
      chunks.push(new Uint8Array(await p.blob.arrayBuffer()));
      chunks.push(enc.encode("\r\n"));
    } else {
      chunks.push(enc.encode("--" + boundary + "\r\nContent-Disposition: form-data; name=\"" + p.name + "\"\r\n\r\n" + p.value + "\r\n"));
    }
  }
  chunks.push(enc.encode("--" + boundary + "--\r\n"));
  const len = chunks.reduce((a, c) => a + c.length, 0), out = new Uint8Array(len);
  let o = 0; chunks.forEach(c => { out.set(c, o); o += c.length; });
  return { bytes: out, contentType: "multipart/form-data; boundary=" + boundary };
}

async function fetchJson(url, opts, ms) {
  opts = opts || {};
  const method = opts.method || "GET";
  let bytes = null, contentType = "";
  if (opts.json) { bytes = new TextEncoder().encode(JSON.stringify(opts.json)); contentType = "application/json"; }
  else if (opts.multipart) { const m = await buildMultipart(opts.multipart); bytes = m.bytes; contentType = m.contentType; }
  const wrap = (status, text) => { let json = null; try { json = JSON.parse(text); } catch (e) {} return { ok: status >= 200 && status < 300, status, json, text: text || "" }; };
  const n = native();
  if (n && n.http) {
    return new Promise((resolve, reject) => {
      const id = "h" + (++httpSeq);
      const timer = setTimeout(() => { delete httpPending[id]; const e = new Error("timeout"); e.name = "AbortError"; reject(e); }, ms || 15000);
      httpPending[id] = (status, text) => {
        clearTimeout(timer);
        if (status <= 0) reject(new Error("Failed to fetch")); else resolve(wrap(status, text));
      };
      n.http(id, method, url, contentType, bytes ? toBase64(bytes) : "", ms || 15000);
    });
  }
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms || 15000);
  try {
    const res = await fetch(url, { method, body: bytes, headers: contentType ? { "Content-Type": contentType } : undefined, signal: ctrl.signal, cache: "no-store" });
    return wrap(res.status, await res.text());
  } finally { clearTimeout(t); }
}

// ============================================================================
// 16 kHz WAV Recording, Room Noise Check, Playback & Model Inference
// ============================================================================
let audioCtx = null, micStream = null, procNode = null, pcm = [], recTimer = null;
let activeAudioEl = null;

function encodeWav16k(input, inRate) {
  const rate = 16000, ratio = inRate / rate;
  const n = Math.max(1, Math.floor(input.length / ratio));
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const s = Math.floor(i * ratio), e = Math.min(input.length, Math.floor((i + 1) * ratio));
    let acc = 0, c = 0;
    for (let j = s; j < e; j++) { acc += input[j]; c++; }
    out[i] = c ? acc / c : (input[s] || 0);
  }
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0, o = 44; i < n; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, out[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return { blob: new Blob([buf], { type: "audio/wav" }), seconds: n / rate };
}

function getTasks() {
  if (state.protocol === "extended") {
    return EXTENDED_TASKS.map(t => ({ ...t, instruction: "Read aloud at a steady, comfortable pace.", sec: state.extDuration }));
  }
  return STANDARD_TASKS;
}

async function checkRoomNoise() {
  if (state.checkingRoom || state.isRecording) return;
  let stream = null, ctx = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) { toast("Allow microphone access to check room noise."); return; }
  state.checkingRoom = true; render();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const an = ctx.createAnalyser(); an.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(an);
  const buf = new Float32Array(an.fftSize);
  const samples = [];
  const iv = setInterval(() => {
    an.getFloatTimeDomainData(buf);
    let sq = 0; for (let i = 0; i < buf.length; i++) sq += buf[i] * buf[i];
    const db = 20 * Math.log10(Math.max(Math.sqrt(sq / buf.length), 1e-5)) + 90;
    samples.push(Math.max(28, Math.min(85, db)));
  }, 100);
  setTimeout(() => {
    clearInterval(iv);
    stream.getTracks().forEach(t => t.stop());
    try { ctx.close(); } catch (e) {}
    const avg = samples.length ? Math.round(samples.reduce((a, b) => a + b, 0) / samples.length) : 38;
    state.ambientDb = avg;
    state.checkingRoom = false;
    haptic(20);
    render();
  }, 1800);
}

async function startRecording() {
  if (state.isRecording) return;
  stopClipPlayback();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) { toast("Allow microphone access to record."); return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(micStream);
  procNode = audioCtx.createScriptProcessor(4096, 1, 1);
  pcm = [];
  let latestRms = 0.05;
  procNode.onaudioprocess = e => {
    if (!state.isRecording) return;
    const ch = e.inputBuffer.getChannelData(0);
    pcm.push(new Float32Array(ch));
    let sq = 0; for (let i = 0; i < ch.length; i += 8) sq += ch[i] * ch[i];
    latestRms = Math.sqrt(sq / (ch.length / 8));
  };
  src.connect(procNode); procNode.connect(audioCtx.destination);
  state.isRecording = true; state.recElapsed = 0; haptic(25); render();
  const target = getTasks()[state.stepIdx].sec, started = Date.now();
  recTimer = setInterval(() => {
    state.recElapsed = (Date.now() - started) / 1000;
    const tEl = document.getElementById("rec-time");
    const pEl = document.getElementById("rec-bar");
    if (tEl) tEl.textContent = Math.min(target, state.recElapsed).toFixed(1) + "s / " + target + "s";
    if (pEl) pEl.style.width = Math.min(100, state.recElapsed / target * 100) + "%";
    const bars = document.querySelectorAll(".wave-bar");
    if (bars.length) {
      const boost = Math.min(1, latestRms * 9);
      bars.forEach((b, idx) => {
        const wave = Math.abs(Math.sin(Date.now() / 110 + idx * 0.55));
        const h = Math.max(14, Math.min(100, Math.round((0.2 + boost * 0.8) * wave * 100)));
        b.style.height = h + "%";
      });
    }
    if (state.recElapsed >= target) stopRecording();
  }, 80);
}

function stopRecording() {
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  const was = state.isRecording;
  state.isRecording = false;
  if (procNode) { try { procNode.disconnect(); } catch (e) {} procNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  const rate = audioCtx ? audioCtx.sampleRate : 48000;
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
  if (was && pcm.length) {
    let len = 0; pcm.forEach(c => len += c.length);
    const all = new Float32Array(len); let o = 0; pcm.forEach(c => { all.set(c, o); o += c.length; });
    const wav = encodeWav16k(all, rate);
    if (wav.seconds < 1) toast("Recording too short (<1s). Please hold steady.");
    else {
      if (state.recordings[state.stepIdx] && state.recordings[state.stepIdx].url) {
        try { URL.revokeObjectURL(state.recordings[state.stepIdx].url); } catch (e) {}
      }
      wav.url = URL.createObjectURL(wav.blob);
      state.recordings[state.stepIdx] = wav;
      state.analysisError = "";
      haptic(35);
      advanceStep();
    }
  }
  render();
}

function stopClipPlayback() {
  if (activeAudioEl) {
    try { activeAudioEl.pause(); } catch (e) {}
    activeAudioEl = null;
  }
  state.playingStep = null;
  state.pairPlaying = false;
}

function playRecordedStep(idx) {
  const rec = state.recordings[idx];
  if (!rec || !rec.blob) return;
  if (state.playingStep === idx) {
    stopClipPlayback();
    render();
    return;
  }
  stopClipPlayback();
  if (!rec.url) rec.url = URL.createObjectURL(rec.blob);
  const audio = new Audio(rec.url);
  activeAudioEl = audio;
  state.playingStep = idx;
  haptic(15);
  render();
  audio.onended = () => { state.playingStep = null; activeAudioEl = null; render(); };
  audio.onerror = () => { state.playingStep = null; activeAudioEl = null; render(); };
  audio.play().catch(() => { state.playingStep = null; render(); });
}

function advanceStep() {
  const next = [0, 1, 2].find(i => !state.recordings[i]);
  if (next !== undefined) state.stepIdx = next;
}

function sessionConsensus(clips) {
  const avg = clips.reduce((a, c) => a + c.p, 0) / clips.length;
  const votes = clips.filter(c => c.dys).length;
  const isDys = votes >= clips.length / 2;
  let sev = "normal", rec;
  if (isDys) {
    const counts = {};
    clips.filter(c => c.dys).forEach(c => counts[c.severity] = (counts[c.severity] || 0) + 1);
    sev = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || "mild";
    if (sev === "severe") rec = "Urgent: Immediate Comprehensive Speech-Language Pathology and Neurological Workup Recommended";
    else if (sev === "moderate") rec = "Prompt: Referral to Speech-Language Pathologist for Instrumental Acoustic and Aerodynamic Motor Assessment";
    else rec = "Mild/Borderline: Longitudinal Speech Acoustic Monitoring and Preventive Clinical Screening";
  } else {
    rec = "Motor speech acoustics within standard physiological boundaries. Re-screen if patient reports speech fatigue or change.";
  }
  return {
    diagnosis: isDys ? "Dysarthria Detected" : "Speech Within Normal Limits",
    isDysarthric: isDys, severity: sev, probability: avg,
    confidence: (avg >= 0.8 || avg <= 0.2) ? "High" : "Moderate",
    votes: votes + "/" + clips.length, recommendation: rec
  };
}

async function analyseViaRest(tasks) {
  const parts = tasks.map((t, i) => ({ name: "files", filename: t.label + ".wav", blob: state.recordings[i].blob }));
  parts.push({ name: "task_labels", value: tasks.map(t => t.label).join(",") });
  const r = await fetchJson(API_BASE + "/api/v1/screen/session", { method: "POST", multipart: parts }, 120000);
  if (!r.ok || !r.json || typeof r.json.consensus_probability !== "number") {
    throw new Error((r.json && typeof r.json.detail === "string") ? r.json.detail : "Server error " + r.status);
  }
  const d = r.json;
  return {
    id: d.session_id, dateIso: d.timestamp, diagnosis: d.consensus_diagnosis, isDysarthric: !!d.is_dysarthric,
    severity: d.consensus_severity, probability: d.consensus_probability, confidence: d.confidence_rating,
    votes: d.dysarthria_vote_ratio, recommendation: d.clinical_recommendation,
    tasks: (d.utterances || []).map(u => ({ task: u.task_name, p: u.dysarthria_probability, severity: u.predicted_severity }))
  };
}

async function gradioPredict(blob, filename) {
  const pre = apiMode === "gradio5" ? "/gradio_api" : "";
  const up = await fetchJson(API_BASE + pre + "/upload", { method: "POST", multipart: [{ name: "files", filename, blob }] }, 60000);
  if (!up.ok || !Array.isArray(up.json) || !up.json[0]) throw new Error("Upload to the analysis server failed (" + up.status + ").");
  const call = await fetchJson(API_BASE + pre + "/call/predict", {
    method: "POST",
    json: { data: [{ path: up.json[0], orig_name: filename, meta: { _type: "gradio.FileData" } }] }
  }, 30000);
  if (!call.ok || !call.json || !call.json.event_id) throw new Error("The analysis server rejected the request (" + call.status + ").");
  const ev = await fetchJson(API_BASE + pre + "/call/predict/" + call.json.event_id, null, 180000);
  for (const b of ev.text.split(/\n\n/)) {
    const evName = (b.match(/^event:\s*(.+)$/m) || [])[1];
    const data = (b.match(/^data:\s*(.*)$/m) || [])[1];
    if (evName === "error") {
      let info = null; try { info = JSON.parse(data); } catch (e) {}
      const raw = (info && (info.title || info.error)) || (data && data !== "null" ? data : "");
      if (/quota/i.test(raw)) throw new Error("The analysis server's free GPU time is used up for now. Please try again later.");
      throw new Error(raw ? "Model server error: " + String(raw).slice(0, 160) : "The model server returned an error. Try again shortly.");
    }
    if (evName === "complete") {
      const out = JSON.parse(data)[0];
      if (!out || out.error) throw new Error((out && out.error) || "No result from the model.");
      const p = parseFloat(String(out["Probability"]).replace("%", "")) / 100;
      return { p, dys: out["Diagnosis"] === "Dysarthria Detected", severity: String(out["Predicted Severity"] || "normal").toLowerCase() };
    }
  }
  throw new Error("No result from the model.");
}

async function analyseViaGradio(tasks) {
  const clips = [];
  for (let i = 0; i < tasks.length; i++) {
    state.analysisStep = i + 1; updateAnalyseLabel();
    const c = await gradioPredict(state.recordings[i].blob, tasks[i].label + ".wav");
    clips.push({ ...c, task: tasks[i].label });
  }
  const cons = sessionConsensus(clips);
  return { ...cons, tasks: clips.map(c => ({ task: c.task, p: c.p, severity: c.severity })) };
}

function updateAnalyseLabel() {
  const el = document.getElementById("analyse-label");
  if (el) el.textContent = state.analysisStep ? "Analysing clip " + state.analysisStep + " of 3…" : "Analysing 3 recordings…";
}

async function runAnalysis() {
  const tasks = getTasks();
  if (!state.recordings[0] || !state.recordings[1] || !state.recordings[2]) return;
  stopClipPlayback();
  state.isAnalyzing = true; state.analysisError = ""; state.analysisStep = 0; render();
  try {
    if (!apiMode) apiMode = await detectApi();
    if (!apiMode) throw new Error("offline");
    const rec = apiMode === "rest" ? await analyseViaRest(tasks) : await analyseViaGradio(tasks);
    rec.id = rec.id || ("s" + Date.now());
    rec.dateIso = rec.dateIso || new Date().toISOString();
    rec.protocol = state.protocol;
    const uKey = userStorageKey(state.user);
    if (uKey) localStorage.removeItem(uKey + "_cleared");
    state.sessions = mergeSessionsList([[rec], state.sessions]);
    state.activeResult = rec;
    state.server = "online";
    saveState(); haptic(50);
    pushSessionToWeb(rec);
  } catch (e) {
    const msg = e && e.message;
    state.analysisError = e && e.name === "AbortError"
      ? "The analysis server took too long to respond. It may be waking up – try again in a minute."
      : (!msg || msg === "offline" || /Failed to fetch|NetworkError|Load failed/i.test(msg))
        ? "Couldn't reach the analysis server. Check your internet and try again."
        : msg;
  }
  state.isAnalyzing = false; state.analysisStep = 0;
  updateStatusPill();
  render();
}

// Biofeedback Practice Engines (Website LoudnessBiofeedback, PacingBoard, MinimalContrastCards Parity)
// ============================================================================
let dbStream = null, dbCtx = null, dbAnalyser = null, dbAnimFrame = null;
let dbSmoothed = 32, dbLastUiMs = 0, dbZoneTimer = 0, dbCurrentZone = "soft";
let dbCalibSamples = null, dbCalibTimeout = null;

function drawLoudnessCanvas() {
  const cv = document.getElementById("db-canvas");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);

  const minThresh = state.dbTargetMin;
  const maxThresh = state.dbTargetMax;
  const step = W / (80 - 1);

  const minNormY = H - ((minThresh - 25) / (95 - 25)) * H;
  const maxNormY = H - ((maxThresh - 25) / (95 - 25)) * H;

  // Draw Target Green Zone Band
  ctx.fillStyle = "rgba(16, 185, 129, 0.18)";
  ctx.fillRect(0, maxNormY, W, Math.max(4, minNormY - maxNormY));

  // Target line boundaries
  ctx.strokeStyle = "rgba(16, 185, 129, 0.5)";
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(0, minNormY); ctx.lineTo(W, minNormY);
  ctx.moveTo(0, maxNormY); ctx.lineTo(W, maxNormY);
  ctx.stroke();
  ctx.setLineDash([]);

  const hist = state.dbHistory;
  if (hist.length < 2) return;

  ctx.beginPath();
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (let i = 0; i < hist.length; i++) {
    const val = hist[i];
    const x = i * step;
    const y = H - ((val - 25) / (95 - 25)) * H;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  const lastVal = hist[hist.length - 1];
  const isTarget = lastVal >= minThresh && lastVal <= maxThresh;

function resetLoudnessChallenge() {

function triggerRoomTare(durationMs, isAutoOnStart) {
  if (dbCalibTimeout) {
    clearTimeout(dbCalibTimeout);
    dbCalibTimeout = null;
  }
  resetLoudnessChallenge();
  state.dbCalibrating = true;
  state.dbCalibratedNotice = "";
  dbCalibSamples = null;
  render();

  const warmupMs = isAutoOnStart ? 850 : 280;
  dbCalibTimeout = setTimeout(() => {
    dbCalibSamples = [];
    dbCalibTimeout = setTimeout(() => {
      const rawSamples = dbCalibSamples || [];
      dbCalibSamples = null;
      state.dbCalibrating = false;

      const nonZero = rawSamples.filter(v => v > 26.5);
      const active = nonZero.length >= 5 ? nonZero : rawSamples;

      let settledFloor = Math.round(dbSmoothed);
      if (active.length > 0) {
        const sorted = active.slice().sort((a, b) => a - b);
        const startIdx = Math.floor(sorted.length * 0.25);
        const endIdx = Math.max(startIdx + 1, Math.ceil(sorted.length * 0.9));
        const trimmed = sorted.slice(startIdx, endIdx);
        const p75 = trimmed[Math.min(trimmed.length - 1, Math.floor(trimmed.length * 0.75))];
        settledFloor = Math.round(Math.max(p75, dbSmoothed));
      }

      const clampedFloor = Math.max(28, Math.min(72, settledFloor));
      dbSmoothed = clampedFloor;
      state.dbBaseline = clampedFloor;
      state.dbLive = clampedFloor;
      state.dbPeak = clampedFloor;
      state.dbHistory = [clampedFloor, clampedFloor];

      const newMin = Math.min(78, clampedFloor + 10);
      const newMax = Math.min(92, clampedFloor + 22);
      state.dbTargetMin = newMin;
      state.dbTargetMax = newMax;

      dbCurrentZone = "soft";
      state.dbZone = "soft";
      resetLoudnessChallenge();

      state.dbCalibratedNotice = isAutoOnStart
        ? `Auto-calibrated settled room baseline at ${clampedFloor} dB → Target Zone set to ${newMin}–${newMax} dB (+10 dB above room).`
        : `Tare complete! Settled baseline locked at ${clampedFloor} dB → Target Zone set to ${newMin}–${newMax} dB & 5s Challenge reset.`;
      haptic(20);
      render();
    }, durationMs || 1500);
  }, warmupMs);
}

async function toggleMeter() {
  if (state.dbRunning) { stopMeter(); render(); return; }
  resetLoudnessChallenge();
  state.dbHistory = [];
  try {
    dbStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    toast("Allow microphone access to use visual biofeedback.");
    return;
  }
  dbCtx = new (window.AudioContext || window.webkitAudioContext)();
  dbAnalyser = dbCtx.createAnalyser();
  dbAnalyser.fftSize = 1024;
  dbAnalyser.smoothingTimeConstant = 0.85;
  dbCtx.createMediaStreamSource(dbStream).connect(dbAnalyser);

  state.dbRunning = true;
  state.dbZone = "soft";
  dbCurrentZone = "soft";
  haptic(20);
  triggerRoomTare(1500, true);

  const bufLen = dbAnalyser.fftSize;
  const dataArr = new Float32Array(bufLen);
  let lastFrameTime = performance.now();
  dbLastUiMs = performance.now();
  let warmupFrames = 25;

  const updateLoop = () => {
    if (!state.dbRunning) return;
    dbAnimFrame = requestAnimationFrame(updateLoop);
    dbAnalyser.getFloatTimeDomainData(dataArr);

    let sumSq = 0;
    for (let i = 0; i < bufLen; i++) sumSq += dataArr[i] * dataArr[i];
    const rms = Math.sqrt(sumSq / bufLen);

    const rawDb = 20 * Math.log10(Math.max(rms, 0.00001)) + 92 + state.dbBoost;
    const clampedInstantDb = Math.max(25, Math.min(95, rawDb));

    if (rms > 0.00005 && warmupFrames > 0) {
      warmupFrames--;
      dbSmoothed = dbSmoothed * 0.5 + clampedInstantDb * 0.5;
    } else if (rms > 0.00002) {
      dbSmoothed = dbSmoothed * 0.88 + clampedInstantDb * 0.12;
    }
    const smoothDbRounded = Math.round(dbSmoothed);

    if (dbCalibSamples !== null && rms > 0.00002) {
      dbCalibSamples.push(clampedInstantDb);
    }

    const now = performance.now();
    const deltaSec = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    const minT = state.dbTargetMin;
    const maxT = state.dbTargetMax;
    const baseT = state.dbBaseline;

    if (state.dbCalibrating) {
      dbCurrentZone = "soft";
      dbZoneTimer = 0;
    } else {
      const effectiveMinT = Math.max(minT, baseT + 9);
      let nextZone = dbCurrentZone;
      if (nextZone === "optimal") {
        if (dbSmoothed < effectiveMinT - 1.5) nextZone = "soft";
        else if (dbSmoothed > maxT + 1.5) nextZone = "loud";
      } else if (nextZone === "soft") {
        if (dbSmoothed >= effectiveMinT + 0.5 && dbSmoothed <= maxT) nextZone = "optimal";
        else if (dbSmoothed > maxT + 1.0) nextZone = "loud";
      } else if (nextZone === "loud") {
        if (dbSmoothed <= maxT - 0.5 && dbSmoothed >= effectiveMinT) nextZone = "optimal";
        else if (dbSmoothed < effectiveMinT - 1.0) nextZone = "soft";
      }
      dbCurrentZone = nextZone;

      if (dbSmoothed >= effectiveMinT - 1.0 && dbSmoothed <= maxT + 2.0) {
        dbZoneTimer = Math.min(5.0, dbZoneTimer + deltaSec);
        if (dbZoneTimer >= 5.0 && !state.dbChallengeSuccess) {
          state.dbChallengeSuccess = true;
          state.dbHoldCount++;
          haptic(50);
          toast("5.0s Vocal Hold Challenge Completed!");
        }
      } else if (dbZoneTimer > 0 && !state.dbChallengeSuccess) {
        dbZoneTimer = Math.max(0, dbZoneTimer - deltaSec * 0.35);
      }
    }

    if (now - dbLastUiMs >= 240) {
      dbLastUiMs = now;
      state.dbLive = smoothDbRounded;
      state.dbPeak = Math.max(state.dbPeak, smoothDbRounded);
      state.dbZone = dbCurrentZone;
      state.dbHoldSec = Math.round(dbZoneTimer * 10) / 10;

      state.dbHistory.push(smoothDbRounded);
      if (state.dbHistory.length > 80) state.dbHistory.shift();
      updateLoudnessDom();
    }
  };
  updateLoop();
}

// Contrast Pair Recorder & Acoustic Envelope Evaluator (Website MinimalContrastCards.tsx Parity)
let pairCtx = null, pairStream = null, pairProc = null, pairPcm = [], pairTimer = null;
function evaluatePairSignal(samples, sr, wordA, wordB) {
  const duration = samples.length / sr;
  const frameSize = Math.max(1, Math.floor(sr * 0.02));
  const frameRms = [];
  const frameZcr = [];
  for (let i = 0; i + frameSize < samples.length; i += frameSize) {
    let sumSq = 0, zc = 0;
    for (let j = 0; j < frameSize; j++) {
      const s = samples[i + j];
      sumSq += s * s;
      if (j > 0 && (samples[i + j] >= 0) !== (samples[i + j - 1] >= 0)) zc++;
    }
    frameRms.push(Math.sqrt(sumSq / frameSize));
    frameZcr.push(zc / frameSize);
  }
  const sortedRms = frameRms.slice().sort((a, b) => a - b);
  const noiseFloor = sortedRms.length ? sortedRms[Math.floor(sortedRms.length * 0.2)] : 0.0005;
  const peakRms = sortedRms.length ? sortedRms[Math.floor(sortedRms.length * 0.96)] : 0.001;
  const snrDb = 20 * Math.log10(Math.max(peakRms, 0.0001) / Math.max(noiseFloor, 0.00005));

  const cleanRms = frameRms.map(r => Math.max(0, r - noiseFloor * 1.15));
  const maxClean = Math.max(...cleanRms, 0.0001);
  const normEnv = cleanRms.map(r => r / maxClean);

  let wordBursts = 0, inBurst = false, dipFrames = 0;
  for (const val of normEnv) {
    if (!inBurst && val >= 0.22) { wordBursts++; inBurst = true; dipFrames = 0; }
    else if (inBurst && val < 0.14) { dipFrames++; if (dipFrames >= 3) inBurst = false; }
    else if (inBurst && val >= 0.22) dipFrames = 0;
  }
  let maxOnsetSlope = 0;
  for (let i = 1; i < normEnv.length; i++) {
    const diff = normEnv[i] - normEnv[i - 1];
    if (diff > maxOnsetSlope) maxOnsetSlope = diff;
  }
  const avgZcr = frameZcr.length ? frameZcr.reduce((a, b) => a + b, 0) / frameZcr.length : 0;
  const hasValidSignal = snrDb >= 4.5 && peakRms >= 0.002 && duration >= 0.45;

  if (!hasValidSignal) {
    return {
      score: 1, accuracyPct: 32, label: "Needs Retry (Too Quiet)",
      note: `Signal was too brief or soft relative to room noise. Speak both "${wordA}" and "${wordB}" with a clear pause between them.`
    };
  }
  if (wordBursts >= 2 && maxOnsetSlope >= 0.08) {
    const acc = Math.min(98, Math.round(88 + Math.min(10, maxOnsetSlope * 18 + avgZcr * 15)));
    return {
      score: 3, accuracyPct: acc, label: "Crisp Contrast (Pass)",
      note: `Detected ${wordBursts} distinct syllable bursts with crisp consonant onset (${Math.round(snrDb)} dB SNR).`
    };
  }
  return {
    score: 2, accuracyPct: 72, label: "Partial Contrast (Close)",
    note: `Detected ${Math.max(1, wordBursts)} vocal burst. Pause briefly between "${wordA}" and "${wordB}" and exaggerate the initial consonant.`
  };
}

    const found = CENTRES.find(c => c.name === state.selectedCentreName);
    if (found) return found;
  }
  if (state.cityFilter && state.cityFilter !== "All" && state.cityFilter !== "Near Me" && Array.isArray(list) && list.length > 0) {
    return list[0];
  }
  return null;
}

function mapEmbedUrl(list) {
  const pinned = activeMapCentre(list);
  const mode = state.mapSatellite ? "1" : "0";

  // 1. User tapped a specific SLP Centre (or filtered by a specific city) -> Zoomed-in hospital view
  if (pinned) {
    const span = state.selectedCentreName ? 3800 : 7500;
    const zoom = state.selectedCentreName ? 15 : 14;
    const q = pinned.name + ", " + pinned.city + ", India";
    return "https://www.google.com/maps/embed?origin=mfe&pb=!1m13!1m8!1m3!1d" + span
      + "!2d" + pinned.lon.toFixed(5)
      + "!3d" + pinned.lat.toFixed(5)
      + "!3m2!1i1024!2i768!4f13.1!2m1!1s" + encodeURIComponent(q)
      + "!5e" + mode + "!6i" + zoom;
  }

  // 2. Live GPS coordinates available -> Zoomed-in view of current location + nearby Speech Therapists
  if (state.coords) {
    const lat = state.coords.lat;
    const lon = state.coords.lon;
    const q = "speech therapist near " + lat.toFixed(4) + "," + lon.toFixed(4);
    return "https://www.google.com/maps/embed?origin=mfe&pb=!1m13!1m8!1m3!1d8500"
      + "!2d" + lon.toFixed(5)
      + "!3d" + lat.toFixed(5)
      + "!3m2!1i1024!2i768!4f13.1!2m1!1s" + encodeURIComponent(q)
      + "!5e" + mode + "!6i" + 14;
  }

  // 3. Fallback while GPS is still locking -> Zoomed-in view of top SLP centre (never zoomed-out country view)
  const fallback = (Array.isArray(list) && list[0]) || CENTRES[0];
  const fq = fallback.name + ", " + fallback.city + ", India";
  return "https://www.google.com/maps/embed?origin=mfe&pb=!1m13!1m8!1m3!1d7500"
    + "!2d" + fallback.lon.toFixed(5)
    + "!3d" + fallback.lat.toFixed(5)
    + "!3m2!1i1024!2i768!4f13.1!2m1!1s" + encodeURIComponent(fq)
    + "!5e" + mode + "!6i" + 14;
}

function fmtDate(iso) {
  const d = new Date(parseIsoMs(iso) || iso);
  if (isNaN(d.getTime())) return String(iso || "");
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function fmtShortDate(iso) {
  const d = new Date(parseIsoMs(iso) || iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
function avatarHtml(u, extraStyle) {
  const displayName = (state.profile && state.profile.fullName) || (u && u.name) || "G";
  const first = displayName.charAt(0).toUpperCase();
  if (u && u.photo) {
    return `<div class="avatar" style="${extraStyle || ""}"><img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" onerror="this.replaceWith(document.createTextNode('${esc(first)}'))"></div>`;
  }
  return `<div class="avatar" style="${extraStyle || ""}">${esc(first)}</div>`;
}
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; }
function resultHeadline(r) {
  return r.isDysarthric ? "Signs of dysarthria" : "Within normal limits";
}
function resultSub(r) {
  const sev = r.isDysarthric && r.severity && r.severity !== "normal" ? cap(r.severity) + " · " : "";
  return sev + Math.round(r.probability * 100) + "% model risk";
}
function fmtTaskName(name) {
  const map = {
    sustained_vowel: "Sustained Vowel (/a/)",
    ddk_pataka: "Rapid Syllables (Pa-Ta-Ka)",
    sentence_reading: "Connected Sentence",
    sentence_passage: "Connected Sentence",
    statement_passage_1: "Rainbow Passage (P1)",
    statement_passage_2: "Grandfather Passage (P2)",
    statement_passage_3: "Morning Garden (P3)"
  };
  return map[name] || String(name || "Task").replace(/_/g, " ");
}

// 270-degree Radial Arc Gauge (Ref 1 Hero Card Right Gauge)
function radialGaugeSvg(pct, label, color, trackColor) {
  const p = Math.max(0, Math.min(100, Math.round(pct)));
  const r = 36, c = 2 * Math.PI * r;
  const arcLen = c * 0.75; // 270 degrees
  const dash = (p / 100) * arcLen;
  return `
    <div style="position:relative; width:92px; height:92px; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
      <svg width="92" height="92" viewBox="0 0 92 92" style="transform:rotate(135deg);">
        <circle cx="46" cy="46" r="${r}" fill="none" stroke="${trackColor || 'rgba(15,76,117,0.14)'}" stroke-width="8" stroke-dasharray="${arcLen.toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round"/>
        <circle cx="46" cy="46" r="${r}" fill="none" stroke="${color || '#0F4C75'}" stroke-width="8" stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round"/>
      </svg>
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding-top:4px;">
        <div class="tabular" style="font-size:20px; font-weight:800; letter-spacing:-0.03em; line-height:1; color:var(--ink);">${p}%</div>
        <div style="font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; color:var(--slate); margin-top:3px;">${esc(label)}</div>
      </div>
    </div>`;
}

// Extract 3 Subsystem Clarity / Risk Scores from a session
function extractSubsystems(sess) {
  const tasks = (sess && Array.isArray(sess.tasks)) ? sess.tasks : [];
  const p0 = tasks[0] ? tasks[0].p : (sess ? sess.probability : 0);
  const p1 = tasks[1] ? tasks[1].p : (sess ? sess.probability : 0);
  const p2 = tasks[2] ? tasks[2].p : (sess ? sess.probability : 0);
  return [
    { name: "Phonation", sub: "Vowel /a/", risk: Math.round(p0 * 100), clarity: Math.round((1 - p0) * 100) },
    { name: "Articulation", sub: "Pa-Ta-Ka", risk: Math.round(p1 * 100), clarity: Math.round((1 - p1) * 100) },
    { name: "Prosody", sub: "Connected", risk: Math.round(p2 * 100), clarity: Math.round((1 - p2) * 100) }
  ];
}

function weekStripHtml() {
  const letters = ["M", "T", "W", "T", "F", "S", "S"];
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const start = new Date(now);
  start.setDate(now.getDate() - dow);
  start.setHours(0, 0, 0, 0);

  const activeDays = new Set();
  state.sessions.forEach(s => {
    const d = new Date(parseIsoMs(s.dateIso) || s.dateIso);
    if (!isNaN(d.getTime())) activeDays.add(d.toDateString());
  });

  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const isToday = i === dow;
    const hasSess = activeDays.has(d.toDateString());
    html += `
      <div class="w-pill ${isToday ? "today" : ""} ${hasSess && !isToday ? "has-sess" : ""}">
        <span class="wl">${letters[i]}</span>
        <span class="wn tabular">${d.getDate()}</span>
        <span class="wd ${hasSess ? "on" : ""}"></span>
      </div>`;
  }
  return html;
}

function miniSparklineSvg(sessions) {
  const chron = sessions.slice(0, 8).slice().reverse();
  if (chron.length < 2) {
    return `<svg width="100%" height="34" viewBox="0 0 120 34"><line x1="4" y1="17" x2="116" y2="17" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/></svg>`;
  }
  const W = 120, H = 34;
  const pts = chron.map((s, i) => {
    const x = 6 + (i / (chron.length - 1)) * (W - 12);
    const y = 5 + s.probability * (H - 10); // lower risk = higher on clarity or lower on risk
    return [x, y];
  });
  const d = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  return `
    <svg width="100%" height="34" viewBox="0 0 120 34" style="overflow:visible;">
      <path d="${d}" fill="none" stroke="#0F4C75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
    </svg>`;
}

function buildFamilySummaryText(r) {
  const p = Math.round((r.probability || 0) * 100);
  if (!r.isDysarthric) {
    return {
      badge: "Reassuring Acoustic Result",
      headline: "Your vocal clarity and pacing look steady today.",
      summary: `Across your 3 recorded tasks, the DysarthriaNet-XC model measured a low dysarthria probability (${p}%), which falls comfortably within typical motor speech limits.`,
      steps: [
        "Continue weekly voice check-ins at a consistent time of day to maintain your personal baseline.",
        "Use the Pacing and Loudness practice tools if your voice ever feels tired in the evening."
      ]
    };
  }
  if (r.severity === "severe" || p >= 75) {
    return {
      badge: "Priority SLP Follow-Up Recommended",
      headline: "Noticeable motor speech effort was detected.",
      summary: `The screening flagged ${r.votes || "multiple"} tasks with a ${p}% model probability (${cap(r.severity)} range). This suggests your speech muscles worked harder to coordinate breath, voicing, or consonant clarity.`,
      steps: [
        "Share or export this PDF report with a Speech-Language Pathologist (SLP) or neurologist for an in-person clinical evaluation.",
        "Practice slow 60 WPM breath-per-phrase pacing and reduce background room noise during family conversations."
      ]
    };
  }
  return {
    badge: "Mild / Borderline Motor Variance",
    headline: "Subtle changes in articulation or pacing were noted.",
    summary: `Your screening returned a ${p}% model score (${cap(r.severity || "mild")} range, ${r.votes || "2/3"} tasks flagged). Mild variation can reflect vocal fatigue, room acoustics, or early motor speech changes.`,
    steps: [
      "Repeat a screening tomorrow morning when well-rested in a quiet room (<45 dB).",
      "Practice Minimal Contrast Word Pairs and Steady 85 WPM Pacing for 5 minutes daily."
    ]
  };
}

        ${Array.isArray(r.tasks) && r.tasks.length ? `

                    </div>
                    <span class="tabular" style="font-size:14px; font-weight:800; color:${flagged ? "var(--rose)" : "var(--emerald-ink)"};">${tp}% risk</span>
                  </div>
                  <div class="meter-track" style="height:8px; margin:0;">

      <div class="row" style="margin-top:4px;">

        <button type="button" class="btn" style="flex:1.3;" onclick="resetScreening()">${icon("rotate", "sm")}<span>New Check</span></button>
      </div>`;
  }

  // Recording Studio View
  const tasks = getTasks(), cur = tasks[state.stepIdx], rec = state.recordings[state.stepIdx];
  const allDone = !!(state.recordings[0] && state.recordings[1] && state.recordings[2]);
  const busy = state.isRecording || state.isAnalyzing;

  return `
    <!-- Protocol Switcher -->
    <div class="seg">
      <button type="button" class="${state.protocol === "standard" ? "on" : ""}" onclick="setProtocol('standard')" ${busy ? "disabled" : ""}>Quick (3 × 5s)</button>

    </div>

    ${state.protocol === "extended" && !allDone ? `
      <div class="chip-scroll">
        ${[15, 30, 45].map(s => `<button type="button" class="chip ${state.extDuration === s ? "on" : ""}" onclick="setExtDuration(${s})" ${busy ? "disabled" : ""}>${s} sec / passage</button>`).join("")}
      </div>` : ""}

    <!-- Pre-Flight Room Noise Check & Mic Setup Tips Pill Row -->
    <div class="row" style="margin-bottom:12px;">
      <button type="button" class="btn soft" style="flex:1; padding:10px 12px; font-size:12px; border-radius:14px;" onclick="checkRoomNoise()" ${busy || state.checkingRoom ? "disabled" : ""}>
        ${icon(state.checkingRoom ? "loader" : "volume", state.checkingRoom ? "xs spin" : "xs")}
        <span>${state.checkingRoom ? "Sampling room…" : (state.ambientDb != null ? (state.ambientDb < 46 ? `Room Quiet · ${state.ambientDb} dB` : `Room Noisy · ${state.ambientDb} dB`) : "Check Room Noise")}</span>
      </button>
      <button type="button" class="btn ghost" style="width:auto; padding:10px 13px; font-size:12px; border-radius:14px;" onclick="openSheet('mictips')">
        ${icon("info", "xs")}<span>Mic Tips</span>
      </button>
    </div>

    ${state.analysisError ? `<div class="alert">${icon("alert", "sm")}<span>${esc(state.analysisError)}</span></div>` : ""}

    <div class="card">
      <!-- 3 Interactive Step Pills -->
      <div class="step-tabs">
        ${tasks.map((t, i) => `
          <button type="button" class="step-tab ${state.recordings[i] ? "done" : ""} ${i === state.stepIdx && !allDone ? "cur" : ""}" onclick="selectStep(${i})" ${busy ? "disabled" : ""}>
            ${state.recordings[i] ? icon("check", "xs") : ""}
            <span>${esc(t.short)}</span>
          </button>`).join("")}
      </div>

      ${allDone && !state.isRecording ? `
        <div class="editorial-title" style="font-size:21px; margin-top:4px;">All 3 voice clips captured</div>
        <div class="muted" style="margin:4px 0 14px;">Preview any recording below or run the DysarthriaNet-XC ensemble analysis.</div>
        <div style="margin-bottom:16px;">
          ${tasks.map((t, i) => `
            <div class="list-row">
              <div style="min-width:0;">
                <div class="lr-title">${esc(t.title)}</div>

              </div>
              <div class="row">
                <button type="button" class="icon-btn sm" onclick="playRecordedStep(${i})" aria-label="Play clip">

        </button>
      ` : `
        <div class="row-between" style="margin-top:4px;">
          <span class="eyebrow" style="margin:0;">${esc(cur.subsystem)}</span>
          <span class="muted tabular" style="font-weight:800;">${cur.sec}s target</span>
        </div>
        <div class="editorial-title" style="font-size:22px; margin-top:4px;">${esc(cur.title)}</div>
        <div class="muted" style="font-size:13px; margin-top:4px;">${esc(cur.instruction)}</div>

        <div class="passage-box">
          <div>“${esc(cur.passage)}”</div>
          <button type="button" class="tts-pill" style="margin-top:12px; font-family:var(--sans);" onclick="speakWord('${esc(cur.passage)}', 0.88)">
            ${icon("volume", "xs")}<span>Hear Prompt</span>

        </div>

        ${rec && !state.isRecording ? `
          <div class="row-between" style="background:var(--mint-card); padding:10px 14px; border-radius:16px; margin-bottom:12px;">
            <div class="row" style="gap:8px;">
              <span style="color:var(--mint-deep);">${icon("check", "sm")}</span>
              <span style="font-size:12px; font-weight:800; color:var(--mint-deep);">Captured (${rec.seconds.toFixed(1)}s · 16 kHz WAV)</span>

            </button>
          </div>` : ""}

        ${state.isRecording ? `
          <div class="row-between" style="font-size:13px; font-weight:800; margin-bottom:4px;">

          </div>
          <div class="wave-bars">
            ${Array.from({ length: 24 }).map(() => `<div class="wave-bar"></div>`).join("")}
          </div>
          <div class="meter-track" style="height:8px; margin:0 0 14px 0;"><div id="rec-bar" class="meter-fill" style="background:var(--rose); transition:none;"></div></div>

        ` : `
          <div class="row">
            <button type="button" class="btn" style="flex:1;" onclick="startRecording()">
              ${icon("mic", "sm")}<span>${rec ? "Record Step Again" : "Start " + cur.sec + "s Recording"}</span>
            </button>
            <label class="icon-btn" aria-label="Upload WAV file">
              ${icon("upload", "sm")}
              <input type="file" accept="audio/*" style="display:none;" onchange="handleUpload(event)" />
            </label>
          </div>
        `}
      `}
    </div>`;
}

function filteredContrastPairs() {
  if (state.contrastCat === "All") return CONTRAST_PAIRS;
  return CONTRAST_PAIRS.filter(p => p.cat === state.contrastCat);
}

  } else if (state.rehabTool === "pacing") {

        <!-- 2 Clinical Goal Profile Cards -->

            <div style="font-size:12px; font-weight:800; color:var(--ink); margin-top:3px;">Articulatory Precision</div>

          </button>
          <button type="button" onclick="setPacingProfile('rate_control')" style="text-align:left; padding:12px; border-radius:18px; cursor:pointer; border:1.5px solid ${state.pacingProfile === "rate_control" ? "#B45309" : "var(--line)"}; background:${state.pacingProfile === "rate_control" ? "var(--butter)" : "var(--soft)"};">
            <div style="font-size:10px; font-weight:800; text-transform:uppercase; color:#92400E;">2. Parkinson's Festination</div>
            <div style="font-size:12px; font-weight:800; color:var(--ink); margin-top:3px;">Slow Rushed Speech</div>

                <div class="tabular" style="font-size:15px; font-weight:800; margin-top:2px;">${st.bpm} BPM</div>
                <div style="font-size:9px; font-weight:700; opacity:0.8; margin-top:1px;">${st.wps}</div>
              </button>`;
          }).join("")}
        </div>
      </div>

      <!-- Interactive Word-by-Word Pacing Board Card -->
      <div class="card" style="padding:18px;">

        <div class="seg" style="margin-bottom:12px;">
          <button type="button" class="${state.pacingMode === "auto" ? "on" : ""}" onclick="setPacingMode('auto')">Auto Metronome</button>
          <button type="button" class="${state.pacingMode === "tap" ? "on" : ""}" onclick="setPacingMode('tap')">Manual Slot Tap</button>
        </div>

        <div class="row-between" style="margin-bottom:10px;">

            <button type="button" class="link-btn" onclick="speakWord(phraseWords().join(' '), 0.82)">${icon("volume", "xs")}<span>Hear Prompt</span></button>

            ${words.map((w, i) => {
              const isCurrent = state.activeWord === i;
              const isDone = state.completedWords.includes(i) && !isCurrent;
              return `
                <button type="button" onclick="tapWordSlot(${i})" style="min-width:78px; padding:10px 13px; border-radius:16px; cursor:pointer; transition:all 0.14s; display:flex; flex-direction:column; align-items:center; gap:3px; border:2px solid ${isCurrent ? "var(--vitality)" : isDone ? "#A7F3D0" : "var(--line)"}; background:${isCurrent ? "var(--ink)" : isDone ? "#ECFDF5" : "#FFFFFF"}; color:${isCurrent ? "#FFFFFF" : isDone ? "#065F46" : "var(--ink)"}; transform:${isCurrent ? "scale(1.05)" : "scale(1)"}; box-shadow:${isCurrent ? "0 6px 16px rgba(20,24,31,0.18)" : "none"};">
                  <div style="display:flex; align-items:center; gap:4px; font-size:9px; font-weight:800; letter-spacing:0.06em; color:${isCurrent ? "var(--vitality)" : isDone ? "#059669" : "var(--muted)"};">
                    <span>BEAT ${i + 1}</span>
                    ${isDone ? icon("check", "xs") : ""}

                  <span style="font-family:var(--serif); font-size:18px; font-weight:700;">${esc(w)}</span>
                </button>`;
            }).join("")}
          </div>

          <div class="row-between" style="margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:11px; font-weight:700; color:var(--slate);">

            <button type="button" class="link-btn" style="font-size:11px;" onclick="resetPacingBtn()">Reset Slots</button>
          </div>
        </div>

        <!-- Tempo & Audio Chime Controls -->
        <div class="row-between" style="margin-bottom:12px;">
          <div>
            <div class="tabular" style="font-size:14px; font-weight:800; color:var(--ink);">
              ${state.pacingMode === "tap"
                ? (state.tapLiveWpm ? `Your Tap Cadence: ${state.tapLiveWpm} WPM` : "Tap each word slot as you speak")
                : `Metronome Tempo: ${state.bpm} BPM (${(state.bpm / 60).toFixed(1)} words/s)`}
            </div>
            <div class="muted" style="font-size:11px;">Audio chime ${state.pacingChime ? "enabled" : "muted"} · pause and breathe at sentence end</div>
