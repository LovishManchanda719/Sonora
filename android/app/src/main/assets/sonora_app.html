            ${state.pacingMode === "auto" ? `
              <button type="button" class="icon-btn sm" onclick="adjustBpm(-5)" aria-label="Slower">${icon("minus", "xs")}</button>
              <button type="button" class="icon-btn sm" onclick="adjustBpm(5)" aria-label="Faster">${icon("plus", "xs")}</button>
            ` : ""}
            <button type="button" class="icon-btn sm" style="background:${state.pacingChime ? "var(--sky-card)" : "#FFF"}; color:${state.pacingChime ? "var(--sky-deep)" : "var(--slate)"};" onclick="togglePacingChime()" aria-label="Toggle audio chime">
              ${icon("volume", "xs")}
            </button>
          </div>
        </div>

        ${state.pacingMode === "tap" ? `
          <button type="button" class="btn sky" onclick="tapNextWord()">
            <span>Tap Next Word Beat (${((state.activeWord + 1) % words.length) + 1}/${words.length})</span>
            ${icon("arrowRight", "sm")}
          </button>
        ` : `
          <button type="button" class="btn ${state.pacingRunning ? "red" : ""}" onclick="togglePacing()">
            ${icon(state.pacingRunning ? "square" : "play", "sm")}
            <span>${state.pacingRunning ? "Stop Metronome" : "Start Pacing Metronome"}</span>
          </button>

        <!-- Custom Phrase Input -->
        <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--line);">
          ${state.showCustomPhraseInput ? `
            <form onsubmit="addCustomPhrase(event)" class="row">
              <input id="custom-phrase-in" type="text" class="input" style="margin:0; flex:1;" placeholder="Type a custom practice sentence…" required />
              <button type="submit" class="btn" style="width:auto; padding:12px 16px;">Use</button>
            </form>
          ` : `
            <div class="row-between">
              <span style="font-size:11px; font-weight:700; color:var(--slate);">Want to practice your own sentence?</span>
              <button type="button" class="link-btn" onclick="toggleCustomPhraseInput()">${icon("plus", "xs")}<span>Custom Phrase</span></button>
            </div>
          `}
        </div>
      </div>`;
  } else {
    // Minimal Contrast Articulation Pairs (Website MinimalContrastCards.tsx Parity)
    const list = filteredContrastPairs();
    const idx = state.contrastIdx % list.length;
    const p = list[idx];
    const cats = ["All", "Voicing", "Place", "Manner", "Final"];
    const ev = state.pairEval;

    body = `
      <div class="chip-scroll">
        ${cats.map(c => `<button type="button" class="chip ${state.contrastCat === c ? "on" : ""}" onclick="setContrastCat('${c}')">${c === "All" ? "All (9)" : c}</button>`).join("")}
      </div>

      <div class="card" style="padding:20px;">
        <div class="row-between" style="margin-bottom:6px;">
          <span class="eyebrow" style="margin:0; color:var(--lav-deep);">${esc(p.focus)}</span>
          <span class="muted tabular" style="font-weight:800;">Pair ${idx + 1} of ${list.length}</span>
        </div>

        <!-- Tactile Dual-Word Cards with Native TTS -->
        <div class="pair-grid" style="position:relative;">
          <div class="pair-card bento-sky">
            <span style="font-size:10px; font-weight:800; text-transform:uppercase; color:var(--sky-deep);">Target Word A</span>

            </button>
          </div>

          <div class="pair-card bento-lav">
            <span style="font-size:10px; font-weight:800; text-transform:uppercase; color:var(--lav-deep);">Target Word B</span>
            <div>
              <div class="pair-word">${esc(p.b)}</div>
              <div class="pair-ipa">${esc(p.ipaB)}</div>
            </div>
            <button type="button" class="tts-pill" onclick="speakWord('${esc(p.b)}', 0.8)">
              ${icon("volume", "xs")}<span>Play Model</span>
            </button>
          </div>
        </div>

        <!-- Articulatory Placement Tip -->
        <div style="background:var(--soft); border-radius:16px; padding:12px 14px; font-size:13px; color:#334155; font-weight:600; line-height:1.45; margin-bottom:14px;">
          <strong style="color:var(--ink);">Articulatory Placement Tip:</strong> ${esc(p.tip)}
        </div>

        <!-- Self-Monitoring Practice Recorder & Playback -->
        <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:14px;">
          <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink); margin-bottom:4px;">
            Self-Monitoring Practice Recorder
          </div>
          <div class="muted" style="font-size:12px; margin-bottom:10px;">
            Record yourself saying <strong>“${esc(p.a)} … ${esc(p.b)}”</strong> with a clear pause between words for acoustic contrast evaluation.
          </div>

          <div class="row" style="gap:8px;">
            <button type="button" class="btn ${state.pairRecording ? "red" : ""}" style="flex:1; padding:12px;" onclick="togglePairRecord()">
              ${icon(state.pairRecording ? "square" : "mic", "sm")}

            </button>
            ${state.pairClip && !state.pairRecording ? `
              <button type="button" class="btn ghost" style="flex:1; padding:12px;" onclick="playPairClip()">
                ${icon(state.pairPlaying ? "square" : "play", "sm")}
                <span>${state.pairPlaying ? "Stop" : "Hear My Voice"}</span>
              </button>` : ""}
          </div>

          ${ev ? `
            <div style="margin-top:12px; padding:12px 14px; border-radius:14px; border:1px solid ${ev.score === 3 ? "#A7F3D0" : ev.score === 2 ? "#FDE68A" : "#FECDD3"}; background:${ev.score === 3 ? "#ECFDF5" : ev.score === 2 ? "#FFFBEB" : "#FFF1F2"};">
              <div class="row-between" style="margin-bottom:4px;">
                <span style="font-size:12px; font-weight:800; color:${ev.score === 3 ? "#065F46" : ev.score === 2 ? "#92400E" : "#9F1239"};">
                  ${esc(ev.label)}
                </span>
                <span class="tabular" style="font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,0.8); color:var(--ink);">
                  Accuracy: ${ev.accuracyPct}%
                </span>
              </div>
              <div style="font-size:12px; color:#334155; font-weight:600; line-height:1.4;">
                ${esc(ev.note)}
              </div>
            </div>` : ""}
        </div>

        <!-- Deck Navigation -->
        <div class="row-between" style="padding-top:8px; border-top:1px solid var(--line);">
          <button type="button" class="icon-btn round sm" onclick="prevPair()" aria-label="Previous pair">${icon("arrowLeft", "sm")}</button>
          <button type="button" class="link-btn" onclick="speakWord('${esc(p.a)}, ${esc(p.b)}', 0.8)">
            ${icon("volume", "xs")}<span>Hear Both Words</span>
          </button>
          <button type="button" class="icon-btn round sm" style="background:var(--ink); color:#FFF; border-color:var(--ink);" onclick="nextPair()" aria-label="Next pair">${icon("arrowRight", "sm")}</button>
        </div>
      </div>`;
  }

  return `
    <div class="seg">
      <button type="button" class="${state.rehabTool === "loudness" ? "on" : ""}" onclick="openTool('loudness')">Loudness</button>
      <button type="button" class="${state.rehabTool === "pacing" ? "on" : ""}" onclick="openTool('pacing')">Pacing</button>
      <button type="button" class="${state.rehabTool === "contrast" ? "on" : ""}" onclick="openTool('contrast')">Word Pairs</button>
    </div>
    ${body}`;
}

function renderTrajectoryChart() {
  const chron = state.sessions.slice(0, 8).slice().reverse();
  if (!chron.length) {
    return `<div class="muted" style="padding:18px 0; text-align:center;">Complete your first screening to unlock your longitudinal trajectory chart.</div>`;
  }
  const avgRisk = Math.round(chron.reduce((a, s) => a + (s.probability || 0) * 100, 0) / chron.length);
  const avgBottomPct = Math.max(10, Math.min(88, avgRisk));

  return `
    <div class="chart-wrap">
      <div class="chart-avg-line" style="bottom:${avgBottomPct}%;">
        <span class="chart-avg-tag">Avg ${avgRisk}% risk</span>
      </div>
      ${chron.map(s => {
        const risk = Math.round((s.probability || 0) * 100);
        const h = Math.max(10, risk);
        const d = new Date(parseIsoMs(s.dateIso) || s.dateIso);
        const lbl = isNaN(d.getTime()) ? "" : d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }).replace(/\s+/g, "");
        if (state.chartMode === "subsystems") {
          const subs = extractSubsystems(s);
          return `
            <div class="chart-col" onclick="openSession('${esc(s.id)}')">
              <div style="display:flex; align-items:flex-end; gap:2px; height:100%; width:100%; justify-content:center;">
                <div style="width:6px; height:${Math.max(8, subs[0].risk)}%; background:#0F4C75; border-radius:4px;"></div>
                <div style="width:6px; height:${Math.max(8, subs[1].risk)}%; background:#0A5C36; border-radius:4px;"></div>
                <div style="width:6px; height:${Math.max(8, subs[2].risk)}%; background:#6D28D9; border-radius:4px;"></div>
              </div>
              <span class="chart-lbl">${esc(lbl)}</span>
            </div>`;
        }
        const barColor = s.isDysarthric ? (s.severity === "severe" ? "#E11D48" : "#F59E0B") : "#10B981";
        return `
          <div class="chart-col" onclick="openSession('${esc(s.id)}')">
            <div style="font-size:9px; font-weight:800; color:var(--slate); margin-bottom:3px;" class="tabular">${risk}%</div>
            <div class="chart-bar" style="height:${h}%; background:${barColor};"></div>
            <span class="chart-lbl">${esc(lbl)}</span>
          </div>`;
      }).join("")}
    </div>
    ${state.chartMode === "subsystems" ? `
      <div class="row" style="justify-content:center; gap:14px; font-size:11px; font-weight:700; color:var(--slate); margin-top:4px;">
        <span class="row" style="gap:4px;"><span class="dot" style="background:#0F4C75;"></span>Phonation</span>
        <span class="row" style="gap:4px;"><span class="dot" style="background:#0A5C36;"></span>Articulation</span>
        <span class="row" style="gap:4px;"><span class="dot" style="background:#6D28D9;"></span>Prosody</span>
      </div>` : ""}`;
}

            ${MIC_SETUP_TIPS.map(item => `
              <div class="list-row" style="display:block;">
                <div class="lr-title">${esc(item.t)}</div>
                <div class="lr-sub">${esc(item.d)}</div>
              </div>`).join("")}
          </div>
          <button type="button" class="btn" onclick="closeSheet()">Got It</button>
        </div>
      </div>`;
  }
  const S = {
    model: {
      h: "DysarthriaNet-XC Architecture",
      p: "Sonora runs a dual-backbone neural acoustic ensemble combining Microsoft WavLM-Base-Plus self-supervised representations with SpeechBrain ECAPA-TDNN articulatory embeddings, fused via Cross-Attention and calibrated across TORGO & UA-Speech benchmarks."
    },
    privacy: {
      h: "Privacy & Acoustic Data",
      p: "Your 16 kHz voice clips are transmitted securely to the Sonora inference server only when you tap Analyse. Screening metadata syncs with your personal Sonora account and can be cleared at any time."
    },
    disclaimer: {
      h: "Clinical Screening Disclaimer",
      p: "Sonora is a clinical decision-support and biofeedback screening companion, not a standalone diagnostic medical device. Always consult a certified Speech-Language Pathologist (SLP) or neurologist for formal diagnosis."
    },
    clear: {
      h: "Clear local screening history?",
      p: "This removes cached screening records from this phone. You can re-sync from your web account anytime by tapping the sync icon on your Profile."
    }
  }[state.sheet];
  if (!S) return "";
  return `
    <div class="backdrop" onclick="closeSheet()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <h3>${S.h}</h3>
        <p>${S.p}</p>
        ${state.sheet === "clear"
          ? `<div class="row"><button type="button" class="btn ghost" style="flex:1;" onclick="closeSheet()">Cancel</button><button type="button" class="btn red" style="flex:1;" onclick="clearHistory()">Clear</button></div>`
          : `<button type="button" class="btn" onclick="closeSheet()">Done</button>`}
      </div>
    </div>`;
}

// ============================================================================
// Root Shell & Navigation Render
// ============================================================================
const TITLES = { screen: "Screening Studio", rehab: "Biofeedback Practice", care: "Care & Family Guide", profile: "Clinical Profile" };

function greetingTimeLabel() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return "Good morning";
  if (h >= 12 && h < 17) return "Good afternoon";
  return "Good evening";
}

function statusPillHtml() {
  const map = { checking: ["var(--muted)", "Connecting"], online: ["var(--emerald)", "Model Online"], offline: ["var(--rose)", "Offline"] };
  const [c, t] = map[state.server];
  return `<span class="dot" style="background:${c};"></span><span>${t}</span>`;
}
function updateStatusPill() { const el = document.getElementById("status-pill"); if (el) el.innerHTML = statusPillHtml(); }

let lastTab = null;
function render() {
  const root = document.getElementById("app");
  if (!state.user) { root.innerHTML = renderAuth(); return; }

  const prevScroll = document.querySelector(".screen-scroll");
  const keepScroll = prevScroll && lastTab === state.tab ? prevScroll.scrollTop : 0;

  const displayName = (state.profile && state.profile.fullName) || state.user.name || "there";
  const first = displayName.split(" ")[0];
  const body = { home: renderHome, screen: renderScreen, rehab: renderPractice, care: renderCare, profile: renderProfile }[state.tab]();

  const header = state.tab === "home"
    ? `<div class="top-left" onclick="switchTab('profile')">
         ${avatarHtml(state.user)}
         <div style="min-width:0;">
           <div class="greeting-sub">${greetingTimeLabel()}</div>
           <div class="page-title" style="font-size:20px;">${esc(first)}</div>
         </div>
       </div>`
    : `<div class="top-left" onclick="switchTab('home')">
         <div class="page-title editorial-title" style="font-size:23px;">${TITLES[state.tab]}</div>
       </div>`;

  const navItems = [
    ["home", "house", "Home"],
    ["screen", "mic", "Screen"],
    ["rehab", "audioLines", "Practice"],
    ["care", "mapPin", "Care"],
    ["profile", "user", "Profile"]
  ];

  root.innerHTML = `
    <div class="screen-scroll">
      <div class="top-bar">${header}<div class="status-pill" id="status-pill">${statusPillHtml()}</div></div>
      ${body}
    </div>
    <div class="nav-wrap"><nav class="nav">
      ${navItems.map(([id, ic, label]) => `<button type="button" class="nav-item ${state.tab === id ? "on" : ""}" onclick="switchTab('${id}')" aria-label="${label}">${icon(ic)}<span>${label}</span></button>`).join("")}
    </nav></div>
    ${renderSheet()}`;

  const sc = document.querySelector(".screen-scroll");
  if (sc && keepScroll) sc.scrollTop = keepScroll;
  lastTab = state.tab;

  if (state.tab === "rehab" && state.rehabTool === "loudness") {
    requestAnimationFrame(updateLoudnessDom);
  }
}

// ============================================================================
// Event Handlers & Exports
// ============================================================================
window.handleEmailSubmit = function(e) {
  e.preventDefault();
  firebaseEmailAuth(document.getElementById("auth-email").value, document.getElementById("auth-pass").value, state.authMode === "signup");
};
window.toggleAuthMode = function() { state.authMode = state.authMode === "signup" ? "signin" : "signup"; state.authError = ""; render(); };
window.continueAsGuest = function() { state.user = { uid: "guest", name: "Guest", email: "", provider: "guest" }; state.sessions = []; saveState(); render(); };

function leaveTab(next) {
  stopClipPlayback();
  if (state.tab === "rehab" && next !== "rehab") {
    if (state.dbRunning) stopMeter();
    if (state.pacingRunning) stopPacing();
    if (state.pairRecording) stopPairRecord();
  }
  if (state.tab === "screen" && next !== "screen" && state.isRecording) stopRecording();
}

window.switchTab = function(t) {
  if (t === state.tab) return;
  leaveTab(t); state.tab = t; haptic(10); render();
  if (t === "profile" || t === "home") syncUserSessions();
  if (t === "care" && !state.coords && !state.locating) locate();
};
window.goScreen = function() { state.activeResult = null; switchTab("screen"); };
window.openSession = function(id) {
  const found = state.sessions.find(s => s.id === id);
  if (!found) return;
  state.activeResult = found;
  state.reportTab = "family";
  switchTab("screen");
};
window.setReportTab = function(rt) { state.reportTab = rt; haptic(10); render(); };

window.openTool = function(tool) {
  if (state.dbRunning && tool !== "loudness") stopMeter();
  if (state.pacingRunning && tool !== "pacing") stopPacing();
  if (state.pairRecording && tool !== "contrast") stopPairRecord();
  state.rehabTool = tool;
  if (state.tab !== "rehab") { leaveTab("rehab"); state.tab = "rehab"; }
  haptic(10); render();
};

window.setProtocol = function(p) { if (p === state.protocol) return; stopClipPlayback(); state.protocol = p; state.stepIdx = 0; state.recordings = {}; state.analysisError = ""; render(); };
window.setExtDuration = function(s) { stopClipPlayback(); state.extDuration = s; state.recordings = {}; state.stepIdx = 0; render(); };
window.selectStep = function(i) { if (state.isRecording || state.isAnalyzing) return; stopClipPlayback(); state.stepIdx = i; render(); };
window.redoStep = function(i) { if (state.isAnalyzing) return; stopClipPlayback(); delete state.recordings[i]; state.stepIdx = i; render(); };
window.resetScreening = function() { stopClipPlayback(); state.recordings = {}; state.stepIdx = 0; state.activeResult = null; state.analysisError = ""; render(); };
window.startRecording = startRecording;
window.stopRecording = stopRecording;
window.playRecordedStep = playRecordedStep;
window.checkRoomNoise = checkRoomNoise;
window.runAnalysis = runAnalysis;
window.speakWord = speakWord;

window.handleUpload = async function(ev) {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const dec = await ctx.decodeAudioData(await f.arrayBuffer());
    const wav = encodeWav16k(dec.getChannelData(0), dec.sampleRate);
    ctx.close();
    wav.url = URL.createObjectURL(wav.blob);
    state.recordings[state.stepIdx] = wav; state.analysisError = ""; advanceStep(); haptic(25); render();
  } catch (e) { toast("Couldn't read that audio file."); }
};

// Practice handlers (LoudnessBiofeedback, PacingBoard, MinimalContrastCards)
window.toggleMeter = toggleMeter;
window.calibrateMeterRoom = calibrateMeterRoom;
window.applyQuietHeadsetPreset = applyQuietHeadsetPreset;
window.resetPeakDb = function() {
  state.dbPeak = state.dbLive;
  haptic(10);
  updateLoudnessDom();
};
window.resetLoudnessChallengeBtn = function() {
  haptic(12);
  resetLoudnessChallenge();
};
window.dismissDbNotice = function() {
  state.dbCalibratedNotice = "";
  render();
};
window.setDbBoost = function(val) {
  state.dbBoost = Math.max(0, Math.min(25, parseInt(val, 10) || 0));
  const lbl = document.getElementById("db-boost-lbl");
  if (lbl) lbl.textContent = state.dbBoost > 0 ? "+" + state.dbBoost + " dB" : "0 dB (Default)";
  updateLoudnessDom();
};
window.adjustTarget = function(d) {
  state.dbTargetMin = Math.max(36, Math.min(76, state.dbTargetMin + d));
  state.dbTargetMax = Math.min(92, state.dbTargetMin + 14);
  haptic(10);
  render();
};

window.setPacingProfile = function(prof) {
  state.pacingProfile = prof;
  if (prof === "clarity") state.bpm = 60;
  else if (prof === "rate_control" && state.bpm > 85) state.bpm = 60;
  resetPacingProgress();
  haptic(12);
  render();
};
window.setPacingMode = function(m) {
  resetPacingProgress();
  state.pacingMode = m;
  haptic(10);
  render();
};
window.setStageBpm = function(b) {
  state.bpm = b;
  if (state.pacingRunning) startPacing();
  haptic(10);
  render();
};
window.togglePacing = function() {
  if (state.pacingRunning) stopPacing();
  else startPacing();
  render();
};
window.togglePacingChime = function() { state.pacingChime = !state.pacingChime; haptic(10); render(); };
window.adjustBpm = function(d) { state.bpm = Math.max(40, Math.min(140, state.bpm + d)); if (state.pacingRunning) startPacing(); render(); };
window.nextPhrase = function() {
  const list = allPacingPhrases();
  state.phraseIdx = (state.phraseIdx + 1) % list.length;
  resetPacingProgress();
  haptic(10);
  render();
};
window.tapWordSlot = tapWordSlot;
window.tapNextWord = tapNextWord;
window.resetPacingBtn = function() {
  resetPacingProgress();
  haptic(10);
  render();
};
window.toggleCustomPhraseInput = function() { state.showCustomPhraseInput = !state.showCustomPhraseInput; render(); };
window.addCustomPhrase = function(e) {
  e.preventDefault();
  const inp = document.getElementById("custom-phrase-in");
  const val = inp ? inp.value.trim() : "";
  if (val && val.split(/\s+/).length >= 2) {
    state.customPhrases.push(val);
    state.phraseIdx = allPacingPhrases().length - 1;
    resetPacingProgress();
    state.showCustomPhraseInput = false;
    saveState(); haptic(20); render();
  } else {
    toast("Enter at least 2 words for pacing.");
  }
};

window.setContrastCat = function(c) { stopClipPlayback(); state.contrastCat = c; state.contrastIdx = 0; state.pairClip = null; state.pairEval = null; haptic(10); render(); };
window.nextPair = function() { stopClipPlayback(); const list = filteredContrastPairs(); state.contrastIdx = (state.contrastIdx + 1) % list.length; state.pairClip = null; state.pairEval = null; haptic(10); render(); };
window.prevPair = function() { stopClipPlayback(); const list = filteredContrastPairs(); state.contrastIdx = (state.contrastIdx - 1 + list.length) % list.length; state.pairClip = null; state.pairEval = null; haptic(10); render(); };
window.togglePairRecord = togglePairRecord;
window.playPairClip = playPairClip;

// Care handlers
window.setCareTab = function(t) {
  state.careTab = t;
  haptic(10);
  render();
  if (t === "centres" && !state.coords && !state.locating) locate();
};
window.setCityFilter = function(c) {
  if (c === "Near Me" && !state.coords) { locate(); return; }
  state.cityFilter = c;
  state.selectedCentreName = "";
  haptic(10);
  render();
};
window.focusMyLocationOnMap = function() {
  state.selectedCentreName = "";
  haptic(15);
  locate();
};
window.focusCentreOnMap = function(name) {
  state.selectedCentreName = name || "";
  haptic(15);
  render();
  const sc = document.querySelector(".screen-scroll");
  if (sc) sc.scrollTo({ top: 0, behavior: "smooth" });
};
window.stepFamilyRule = function(d) {
  state.familyRuleIdx = (state.familyRuleIdx + d + FAMILY_TIPS.length) % FAMILY_TIPS.length;
  haptic(10); render();
};
window.setFamilyRule = function(i) { state.familyRuleIdx = i; haptic(10); render(); };
window.locate = locate;
window.toggleSatellite = function() { state.mapSatellite = !state.mapSatellite; haptic(10); render(); };
window.openMapsSearch = function() {
  const pinned = state.selectedCentreName ? CENTRES.find(c => c.name === state.selectedCentreName) : null;
  if (pinned) {
    openExternal("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(pinned.name + " " + pinned.city));
    return;
  }
  const q = state.coords ? "speech therapist" : "speech therapist near me";
  const at = state.coords ? "/@" + state.coords.lat + "," + state.coords.lon + ",13z" : "";
  openExternal("https://www.google.com/maps/search/" + encodeURIComponent(q) + at);
};
window.openDirections = function(lat, lon) { openExternal("https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lon); };
window.openExternal = function(url) { const n = native(); if (n && n.openExternalUrl) n.openExternalUrl(url); else window.open(url, "_blank"); };

// Profile, Dossier & Exports
window.setProfileTab = function(t) { state.profileTab = t; state.profileSavedMsg = ""; haptic(10); render(); };
window.setChartMode = function(m) { state.chartMode = m; haptic(10); render(); };
window.syncNowToast = async function() {
  haptic(15);
  toast("Syncing with Sonora cloud & web…");
  await syncUserSessions();
};
window.saveClinicalProfile = function(e) {
  e.preventDefault();
  state.profile.fullName = (document.getElementById("prof-name").value || "").trim();
  state.profile.age = (document.getElementById("prof-age").value || "").trim();
  state.profile.sex = document.getElementById("prof-sex").value || "Male";
  state.profile.condition = document.getElementById("prof-cond").value || "Undiagnosed / General Motor Speech Screening";
  if (state.user && state.profile.fullName) state.user.name = state.profile.fullName;
  state.profileSavedMsg = "Clinical dossier saved & synced.";
  saveState(); haptic(25); render();
  pushProfileToWeb();
};
window.handlePhotoUpload = function(ev) {
  const f = ev.target.files && ev.target.files[0];
  if (!f || !state.user) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      const S = 192;
      cv.width = S; cv.height = S;
      const ctx = cv.getContext("2d");
      const min = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, S, S);
      state.user.photo = cv.toDataURL("image/jpeg", 0.84);
      saveState(); haptic(20); render();
      pushProfileToWeb();
      toast("Profile photo updated.");
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
};

window.shareResult = function() {
  const r = state.activeResult; if (!r) return;
  const txt = "Sonora Clinical Voice Screening (" + fmtDate(r.dateIso) + ")\nResult: " + resultHeadline(r) + " (" + resultSub(r) + ", " + (r.votes || "0/3") + " tasks flagged).\nRecommendation: " + (r.recommendation || "Within normal limits.") + "\nScreening companion only, not a formal diagnosis.";
  const n = native();
  if (n && n.shareReport) n.shareReport("Sonora Clinical Voice Report", txt);
  else if (navigator.share) navigator.share({ title: "Sonora Clinical Voice Report", text: txt }).catch(() => {});
};

window.exportSingleSessionPdf = function() {
  const r = state.activeResult; if (!r) return;
  const u = state.user || {};
  const p = state.profile || {};
  document.getElementById("print-report").innerHTML = `
    <h2 style="margin:0 0 4px;">Sonora Clinical Speech Screening Report</h2>
    <div><strong>Patient:</strong> ${esc(p.fullName || u.name || "Guest")}${p.age ? " · Age " + esc(p.age) : ""}${p.sex ? " · " + esc(p.sex) : ""}</div>
    <div><strong>Context:</strong> ${esc(p.condition || "General Motor Speech Screening")} · <strong>Date:</strong> ${fmtDate(r.dateIso)}</div>
    <hr style="margin:12px 0; border:none; border-top:1px solid #ccc;"/>
    <p><strong>Consensus Result:</strong> ${resultHeadline(r)} (${Math.round(r.probability * 100)}% probability · ${esc(cap(r.severity))} severity · ${esc(r.votes || "0/3")} tasks flagged · ${esc(r.confidence || "Moderate")} confidence)</p>
    <p><strong>Clinical Recommendation:</strong> ${esc(r.recommendation || "")}</p>
    <table><thead><tr><th>Speech Task</th><th>Dysarthria Probability</th><th>Predicted Severity</th></tr></thead><tbody>
      ${(r.tasks || []).map(t => `<tr><td>${esc(fmtTaskName(t.task))}</td><td>${Math.round((t.p || 0) * 100)}%</td><td>${esc(cap(t.severity || "normal"))}</td></tr>`).join("")}
    </tbody></table>
    <p style="margin-top:18px; font-size:11px;">Generated by Sonora (DysarthriaNet-XC Hybrid WavLM + ECAPA-TDNN). Decision-support screening tool; confirm with an SLP.</p>`;
  const n = native();
  if (n && n.printClinicalReport) n.printClinicalReport("Sonora_Report_" + (r.id || "Session")); else window.print();
};

window.exportReport = function() {
  const u = state.user || {};
  const p = state.profile || {};
  document.getElementById("print-report").innerHTML = `
    <h2 style="margin:0 0 4px;">Sonora Longitudinal Voice Screening Dossier</h2>
    <div><strong>Patient:</strong> ${esc(p.fullName || u.name || "Guest")}${u.email ? " (" + esc(u.email) + ")" : ""}${p.age ? " · Age " + esc(p.age) : ""}${p.sex ? " · " + esc(p.sex) : ""}</div>
    <div><strong>Clinical Context:</strong> ${esc(p.condition || "General Motor Speech Screening")} · <strong>Exported:</strong> ${new Date().toLocaleString()}</div>
    <table><thead><tr><th>Date</th><th>Result</th><th>Severity</th><th>Votes</th><th>Risk</th><th>Confidence</th></tr></thead><tbody>
      ${state.sessions.map(s => `<tr><td>${fmtDate(s.dateIso)}</td><td>${resultHeadline(s)}</td><td>${esc(cap(s.severity))}</td><td>${esc(s.votes || "")}</td><td>${Math.round(s.probability * 100)}%</td><td>${esc(s.confidence || "")}</td></tr>`).join("")}
    </tbody></table>
    <p style="margin-top:16px; font-size:11px;">Screening results from the DysarthriaNet-XC model. Not a standalone medical diagnosis.</p>`;
  const n = native();
  if (n && n.printClinicalReport) n.printClinicalReport("Sonora_Longitudinal_Dossier"); else window.print();
};

window.exportCsv = function() {
  if (!state.sessions.length) return;
  const rows = [["Session_ID", "Timestamp_ISO", "Diagnosis", "Severity", "Probability_Pct", "Votes", "Confidence"]];
  state.sessions.forEach(s => {
    rows.push([s.id, s.dateIso, resultHeadline(s), s.severity || "normal", Math.round(s.probability * 100) + "%", s.votes || "", s.confidence || ""]);
  });
  const csv = rows.map(r => r.map(v => '"' + String(v || "").replace(/"/g, '""') + '"').join(",")).join("\n");
  const n = native();
  if (n && n.shareReport) {
    n.shareReport("Sonora_Screenings.csv", csv);
  } else if (n && n.copyToClipboard) {
    n.copyToClipboard("Sonora CSV", csv);
  }
};

window.openSheet = function(s) { state.sheet = s; render(); };
window.closeSheet = function() { state.sheet = null; render(); };
window.clearHistory = function() {
  const uKey = userStorageKey(state.user);
  if (uKey) { try { localStorage.setItem(uKey + "_cleared", "1"); } catch (e) {} }
  state.sessions = []; state.sheet = null; saveState(); render();
};
window.signOut = function() { leaveTab("home"); state.user = null; state.sessions = []; state.activeResult = null; state.tab = "home"; saveState(); render(); };

window.onNativeBack = function() {
  if (!state.user && state.authView && state.authView !== "main") { backToAuthMain(); return true; }
  if (state.sheet) { closeSheet(); return true; }
  if (state.tab === "screen" && state.activeResult) { state.activeResult = null; render(); return true; }
  if (state.user && state.tab !== "home") { switchTab("home"); return true; }
  return false;
};

// Live countdown for the "Resend code" button on the phone sign-in screen
setInterval(() => {
  if (state.user || state.authView !== "otp") return;
  const btn = document.getElementById("otp-resend");
  if (!btn) return;
  const wait = Math.max(0, Math.ceil((state.otpResendAt - Date.now()) / 1000));
  btn.textContent = wait > 0 ? "Resend code in " + wait + "s" : "Resend code";
  btn.disabled = wait > 0 || state.authBusy;
}, 1000);

render();
checkServer();
syncUserSessions();
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkServer(); syncUserSessions(); } });
</script>
